    for (let i = 0; i < size; i++) {
      setFn(6, i, i % 2 === 0);
      setFn(i, 6, i % 2 === 0);
    }
    const finder = (x, y) => {
      for (let dy = -4; dy <= 4; dy++)
        for (let dx = -4; dx <= 4; dx++) {
          const d = Math.max(Math.abs(dx), Math.abs(dy));
          const xx = x + dx;
          const yy = y + dy;
          if (xx >= 0 && xx < size && yy >= 0 && yy < size) setFn(xx, yy, d !== 2 && d !== 4);
        }
    };
    finder(3, 3);
    finder(size - 4, 3);
    finder(3, size - 4);
    if (ver > 1) {
      const n = Math.floor(ver / 7) + 2;
      const step = Math.floor((ver * 8 + n * 3 + 5) / (n * 4 - 4)) * 2;
      const pos = [6];
      for (let p = size - 7; pos.length < n; p -= step) pos.splice(1, 0, p);
      for (let i = 0; i < n; i++)
        for (let j = 0; j < n; j++) {
          if ((i === 0 && j === 0) || (i === 0 && j === n - 1) || (i === n - 1 && j === 0)) continue;
          for (let dy = -2; dy <= 2; dy++)
            for (let dx = -2; dx <= 2; dx++) setFn(pos[i] + dx, pos[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
        }
    }
    const drawFormat = (mask) => {
      const d = (e.bits << 3) | mask;
      let rem = d;
      for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
      const b = ((d << 10) | rem) ^ 0x5412;
      const bit = (i) => ((b >>> i) & 1) !== 0;
      for (let i = 0; i <= 5; i++) setFn(8, i, bit(i));
      setFn(8, 7, bit(6));
      setFn(8, 8, bit(7));
      setFn(7, 8, bit(8));
      for (let i = 9; i < 15; i++) setFn(14 - i, 8, bit(i));
      for (let i = 0; i < 8; i++) setFn(size - 1 - i, 8, bit(i));
      for (let i = 8; i < 15; i++) setFn(8, size - 15 + i, bit(i));
      setFn(8, size - 8, true);
    };
    drawFormat(0);
    if (ver >= 7) {
      let rem = ver;
      for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1f25);
      const b = (ver << 12) | rem;
      for (let i = 0; i < 18; i++) {
        const bit = ((b >>> i) & 1) !== 0;
        const a = size - 11 + (i % 3);
        const c = Math.floor(i / 3);
        setFn(a, c, bit);
        setFn(c, a, bit);
      }
    }
    // Place data.
    let i = 0;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let v = 0; v < size; v++)
        for (let j = 0; j < 2; j++) {
          const x = right - j;
          const up = ((right + 1) & 2) === 0;
          const y = up ? size - 1 - v : v;
          if (!isFn[y][x] && i < codewords.length * 8) {
            mods[y][x] = ((codewords[i >>> 3] >>> (7 - (i & 7))) & 1) !== 0;
            i++;
          }
        }
    }
    const maskFn = [
      (x, y) => (x + y) % 2 === 0,
      (x, y) => y % 2 === 0,
      (x) => x % 3 === 0,
      (x, y) => (x + y) % 3 === 0,
      (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0,
      (x, y) => ((x * y) % 2) + ((x * y) % 3) === 0,
      (x, y) => (((x * y) % 2) + ((x * y) % 3)) % 2 === 0,
      (x, y) => (((x + y) % 2) + ((x * y) % 3)) % 2 === 0,
    ];
    const applyMask = (m) => {
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!isFn[y][x] && maskFn[m](x, y)) mods[y][x] = !mods[y][x];
    };
    const penalty = () => {
      let p = 0;
      let dark = 0;
      for (let y = 0; y < size; y++) {
        let runR = 1;
        let runC = 1;
        for (let x = 0; x < size; x++) {
          if (mods[y][x]) dark++;
          if (x > 0) {
            if (mods[y][x] === mods[y][x - 1]) {
              runR++;
              if (runR === 5) p += 3;
              else if (runR > 5) p++;
            } else runR = 1;
            if (mods[x][y] === mods[x - 1][y]) {
              runC++;
              if (runC === 5) p += 3;
              else if (runC > 5) p++;
            } else runC = 1;
          }
          if (x > 0 && y > 0) {
            const c = mods[y][x];
            if (c === mods[y][x - 1] && c === mods[y - 1][x] && c === mods[y - 1][x - 1]) p += 3;
          }
        }
      }
      const k = Math.ceil(Math.abs(dark * 20 - size * size * 10) / (size * size)) - 1;
      return p + Math.max(0, k) * 10;
    };
    let best = 0;
    let bestP = Infinity;
    for (let m = 0; m < 8; m++) {
      applyMask(m);
      drawFormat(m);
      const p = penalty();
      if (p < bestP) {
        bestP = p;
        best = m;
      }
      applyMask(m);
    }
    applyMask(best);
    drawFormat(best);
    return { size, version: ver, modules: mods };
  }

  /** SVG markup string with a quiet zone (all values are numbers we generate). */
  function toSvg(qr, quiet = 4) {
    const n = qr.size + quiet * 2;
    let path = '';
    for (let y = 0; y < qr.size; y++)
      for (let x = 0; x < qr.size; x++) if (qr.modules[y][x]) path += 'M' + (x + quiet) + ' ' + (y + quiet) + 'h1v1h-1z';
    return (
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + n + ' ' + n + '" shape-rendering="crispEdges">' +
      '<rect width="' + n + '" height="' + n + '" fill="#fff"/><path fill="#000" d="' + path + '"/></svg>'
    );
  }

  D.qr = { encode, toSvg };
})();

/* ---- net/relays.js ---- */
/* Dyad net: signalling over public relays (WebTorrent trackers, Nostr, MQTT).
 * Relays only ever carry encrypted handshake blobs on hashed topics. */
(() => {
  'use strict';
  const D = globalThis.Dyad;
  const { Emitter, log, randomId, utf8, fromUtf8, hex, concatBytes } = D;

  const DEFAULT_RELAYS = [
    'wss://tracker.openwebtorrent.com',
    'wss://tracker.webtorrent.dev',
    'wss://tracker.files.fm:7073/announce',
    'nostr+wss://relay.damus.io',
    'nostr+wss://nos.lol',
    'nostr+wss://relay.primal.net',
    'nostr+wss://relay.nostr.band',
    'mqtt+wss://broker.emqx.io:8084/mqtt',
    'mqtt+wss://broker.hivemq.com:8884/mqtt',
  ];

  /** Parses "kind+wss://host" (kind defaults to tracker). */
  function parseRelay(spec) {
    const m = /^(?:(tracker|nostr|mqtt)\+)?(wss?:\/\/[^\s]+)$/i.exec(String(spec).trim());
    if (!m) return null;
    let url;
    try {
      url = new URL(m[2]);
    } catch {
      return null;
    }
    return { kind: (m[1] || 'tracker').toLowerCase(), url: url.href.replace(/\/$/, url.pathname === '/' ? '' : '/') };
  }

  class BaseRelay extends Emitter {
    constructor(url, sid) {
      super();
      this.url = url;
      this.sid = sid;
      this.status = 'idle';
      this.lastError = '';
      this.topics = new Map(); // topic -> true
      this.ws = null;
      this.fails = 0;
      this.closed = false;
      this.timer = null;
    }
    get host() {
      try {
        return new URL(this.url).host;
      } catch {
        return this.url;
      }
    }
    setStatus(s, err) {
      this.status = s;
      if (err !== undefined) this.lastError = err;
      this.emit('status', s);
    }
    connect() {
      if (this.closed || (this.ws && this.ws.readyState <= 1)) return;
      this.setStatus('connecting');
      let ws;
      try {
        ws = this.createSocket();
      } catch (e) {
        this.setStatus('error', e.message);
        this.scheduleReconnect();
        return;
      }
      this.ws = ws;
      const openTimer = setTimeout(() => {
        if (ws.readyState !== 1) {
          try {
            ws.close();
          } catch {}
        }
      }, 10000);
      ws.onopen = () => {
        clearTimeout(openTimer);
        this.fails = 0;
        this.setStatus('open', '');
        this.onOpen();
      };
      ws.onmessage = (e) => {
        try {
          this.onData(e.data);
        } catch (err) {
          log.warn('relay parse', this.host, err);
        }
      };
      ws.onerror = () => {
        this.lastError = 'connection failed';
      };
      ws.onclose = () => {
        clearTimeout(openTimer);
        this.onClose();
        if (this.ws === ws) this.ws = null;
        if (this.closed) return;
        this.fails++;
        this.setStatus(this.fails >= 2 ? 'unreachable' : 'error', this.lastError || 'closed');
        this.scheduleReconnect();
      };
    }
    scheduleReconnect() {
      clearTimeout(this.timer);
      const delay = Math.min(120000, 2000 * 2 ** Math.min(this.fails, 6)) * (0.75 + Math.random() * 0.5);
      this.timer = setTimeout(() => this.connect(), delay);
    }
    send(data) {
      if (this.ws && this.ws.readyState === 1) {
        this.ws.send(data);
        return true;
      }
      return false;
    }
    subscribe(topic) {
      if (this.topics.has(topic)) return;
      this.topics.set(topic, true);
      if (this.status === 'open') this.onSubscribe(topic);
      else this.connect();
    }
    unsubscribe(topic) {
      if (!this.topics.delete(topic)) return;
      if (this.status === 'open') this.onUnsubscribe(topic);
    }
    close() {
      this.closed = true;
      clearTimeout(this.timer);
      this.onClose();
      if (this.ws) {
        try {
          this.ws.close();
        } catch {}
      }
      this.ws = null;
      this.setStatus('closed');
    }
    onOpen() {
      for (const t of this.topics.keys()) this.onSubscribe(t);
    }
    onClose() {}
    onSubscribe() {}
    onUnsubscribe() {}
    deliver(topic, payload, fromSid) {
      this.emit('message', topic, payload, fromSid || null);
    }
  }

  /* ---------- WebTorrent tracker ---------- */
  class TrackerRelay extends BaseRelay {
    constructor(url, sid) {
      super(url, sid);
      this.kind = 'tracker';
      this.hashes = new Map(); // infoHash -> topic
      this.lastAnnounce = new Map();
      this.announceTimer = null;
    }
    createSocket() {
      return new WebSocket(this.url);
    }
    infoHash(topic) {
      return topic.slice(0, 20); // 20 ASCII chars, the topic is already a slow hash
    }
    onOpen() {
      super.onOpen();
      clearInterval(this.announceTimer);
      this.announceTimer = setInterval(() => this.emit('wantAnnounce'), 30000);
    }
    onClose() {
      clearInterval(this.announceTimer);
    }
    onSubscribe(topic) {
      this.hashes.set(this.infoHash(topic), topic);
      this.emit('wantAnnounce', topic);
    }
    onUnsubscribe(topic) {
      const ih = this.infoHash(topic);
      this.hashes.delete(ih);
      this.send(JSON.stringify({ action: 'announce', event: 'stopped', info_hash: ih, peer_id: this.sid, numwant: 0, uploaded: 0, downloaded: 0, left: 0 }));
    }
    /** Broadcast: each "offer" is forwarded by the tracker to one random swarm member. */
    publish(topic, payload, toSid) {
      const ih = this.infoHash(topic);
      if (toSid) {
        return this.send(
          JSON.stringify({
            action: 'announce',
            info_hash: ih,
            peer_id: this.sid,
            to_peer_id: toSid,
            offer_id: randomId(20),
            answer: { type: 'answer', sdp: payload },
          })
        );
      }
      const offers = [];
      for (let i = 0; i < 10; i++) offers.push({ offer_id: randomId(20), offer: { type: 'offer', sdp: payload } });
      this.lastAnnounce.set(topic, Date.now());
      return this.send(
        JSON.stringify({
          action: 'announce',
          info_hash: ih,
          peer_id: this.sid,
          numwant: offers.length,
          uploaded: 0,
          downloaded: 0,
          left: 0,
          event: 'started',
          offers,
        })
      );
    }
    onData(data) {
      const msg = JSON.parse(typeof data === 'string' ? data : fromUtf8(new Uint8Array(data)));
      if (msg['failure reason']) {
        this.lastError = msg['failure reason'];
        log.warn('tracker failure', this.host, msg['failure reason']);
        return;
      }
      if (msg.action !== 'announce') return;
      const topic = this.hashes.get(msg.info_hash);
      if (!topic || msg.peer_id === this.sid) return;
      const body = (msg.offer && msg.offer.sdp) || (msg.answer && msg.answer.sdp);
      if (typeof body === 'string') this.deliver(topic, body, msg.peer_id);
    }
  }

  /* ---------- Nostr (ephemeral events) ---------- */
  class NostrRelay extends BaseRelay {
    constructor(url, sid) {
      super(url, sid);
      this.kind = 'nostr';
      this.sk = D.schnorr.randomSecretKey();
      this.pub = hex(D.schnorr.getPublicKey(this.sk));
      this.subs = new Map(); // subId -> topic
    }
    createSocket() {
      return new WebSocket(this.url);
    }
    static kindFor(topic) {
      return 20000 + (parseInt(topic.slice(0, 4), 16) % 10000);
    }
    onSubscribe(topic) {
      const subId = 'dy' + randomId(10);
      this.subs.set(subId, topic);
      this.send(
        JSON.stringify(['REQ', subId, { kinds: [NostrRelay.kindFor(topic)], '#x': [topic], since: Math.floor(Date.now() / 1000) - 10 }])
      );
      setTimeout(() => this.emit('wantAnnounce', topic), 300);
    }
    onUnsubscribe(topic) {
      for (const [id, t] of this.subs) {
        if (t === topic) {
          this.send(JSON.stringify(['CLOSE', id]));
          this.subs.delete(id);
        }
      }
    }
    onOpen() {
      this.subs.clear();
      super.onOpen();
    }
    async publish(topic, payload) {
      if (this.status !== 'open') return false;
      const ev = {
        kind: NostrRelay.kindFor(topic),
        created_at: Math.floor(Date.now() / 1000),
        tags: [['x', topic]],
        content: payload,
        pubkey: this.pub,
      };
      const idBytes = await D.sha256(JSON.stringify([0, ev.pubkey, ev.created_at, ev.kind, ev.tags, ev.content]));
      ev.id = hex(idBytes);
      ev.sig = hex(await D.schnorr.sign(idBytes, this.sk));
      return this.send(JSON.stringify(['EVENT', ev]));
    }
    onData(data) {
      const msg = JSON.parse(data);
      if (!Array.isArray(msg)) return;
      if (msg[0] === 'EVENT' && msg[2]) {
        const topic = this.subs.get(msg[1]);
        const ev = msg[2];
        if (!topic || ev.pubkey === this.pub || typeof ev.content !== 'string') return;
        this.deliver(topic, ev.content, null);
      } else if (msg[0] === 'OK' && msg[2] === false) {
        this.lastError = String(msg[3] || 'rejected').slice(0, 120);
        log.warn('nostr rejected', this.host, this.lastError);
      } else if (msg[0] === 'NOTICE' || msg[0] === 'CLOSED') {
        log.info('nostr notice', this.host, String(msg[msg.length - 1]).slice(0, 120));
      }
    }
  }

  /* ---------- MQTT 3.1.1 over WebSocket (QoS 0 only) ---------- */
  const mqtt = {
    varLen(n) {
      const out = [];
      do {
        let b = n % 128;
        n = Math.floor(n / 128);
        if (n > 0) b |= 128;
        out.push(b);
      } while (n > 0);
      return out;
    },
    str(s) {
      const b = utf8(s);
      return concatBytes(new Uint8Array([b.length >> 8, b.length & 255]), b);
    },
    packet(type, body) {
      return concatBytes(new Uint8Array([type, ...mqtt.varLen(body.length)]), body);
    },
    connect(clientId, keepAlive = 60) {
      const vh = concatBytes(mqtt.str('MQTT'), new Uint8Array([4, 0x02, keepAlive >> 8, keepAlive & 255]));
      return mqtt.packet(0x10, concatBytes(vh, mqtt.str(clientId)));
    },
    subscribe(id, topic) {
      return mqtt.packet(0x82, concatBytes(new Uint8Array([id >> 8, id & 255]), mqtt.str(topic), new Uint8Array([0])));
    },
    unsubscribe(id, topic) {
      return mqtt.packet(0xa2, concatBytes(new Uint8Array([id >> 8, id & 255]), mqtt.str(topic)));
    },
    publish(topic, payload) {
      return mqtt.packet(0x30, concatBytes(mqtt.str(topic), utf8(payload)));
    },
    ping() {
      return new Uint8Array([0xc0, 0]);
    },
    /** Splits a byte buffer into complete packets. Returns [packets, rest]. */
    parse(buf) {
      const packets = [];
      let i = 0;
      while (i < buf.length) {
        let mult = 1;
        let len = 0;
        let j = i + 1;
        let b;
        do {
          if (j >= buf.length) return [packets, buf.subarray(i)];
          b = buf[j++];
          len += (b & 127) * mult;
          mult *= 128;
        } while (b & 128);
        if (j + len > buf.length) return [packets, buf.subarray(i)];
        packets.push({ type: buf[i] >> 4, flags: buf[i] & 15, body: buf.subarray(j, j + len) });
        i = j + len;
      }
      return [packets, new Uint8Array(0)];
    },
  };

  class MqttRelay extends BaseRelay {
    constructor(url, sid) {
      super(url, sid);
      this.kind = 'mqtt';
      this.buf = new Uint8Array(0);
      this.pid = 1;
      this.ready = false;
      this.pingTimer = null;
    }
    createSocket() {
      const ws = new WebSocket(this.url, ['mqtt']);
      ws.binaryType = 'arraybuffer';
      return ws;
    }
    mtopic(topic) {
      return 'dyad/v1/' + topic.slice(0, 40);
    }
    onOpen() {
      this.ready = false;
      this.buf = new Uint8Array(0);
      this.send(mqtt.connect('dyad' + randomId(12)));
      clearInterval(this.pingTimer);
      this.pingTimer = setInterval(() => this.send(mqtt.ping()), 30000);
    }
    onClose() {
      clearInterval(this.pingTimer);
      this.ready = false;
    }
    onSubscribe(topic) {
      if (!this.ready) return;
      this.pid = (this.pid % 65000) + 1;
      this.send(mqtt.subscribe(this.pid, this.mtopic(topic)));
      setTimeout(() => this.emit('wantAnnounce', topic), 300);
    }
    onUnsubscribe(topic) {
      if (!this.ready) return;
      this.pid = (this.pid % 65000) + 1;
      this.send(mqtt.unsubscribe(this.pid, this.mtopic(topic)));
    }
    publish(topic, payload) {
      if (!this.ready) return false;
      return this.send(mqtt.publish(this.mtopic(topic), payload));
    }
    onData(data) {
      const chunk = new Uint8Array(data);
      const [packets, rest] = mqtt.parse(concatBytes(this.buf, chunk));
      this.buf = rest.slice();
      for (const p of packets) {
        if (p.type === 2) {
          if (p.body[1] !== 0) {
            this.lastError = 'broker refused connection';
            return;
          }
          this.ready = true;
          for (const t of this.topics.keys()) this.onSubscribe(t);
          this.emit('ready');
        } else if (p.type === 3) {
          const tl = (p.body[0] << 8) | p.body[1];
          const t = fromUtf8(p.body.subarray(2, 2 + tl));
          let off = 2 + tl;
          if ((p.flags >> 1) & 3) off += 2; // packet id for QoS > 0
          const payload = fromUtf8(p.body.subarray(off));
          for (const topic of this.topics.keys()) {
            if (this.mtopic(topic) === t) this.deliver(topic, payload, null);
          }
        }
      }
    }
  }

  /** Manages all relay connections and fans messages in and out. */
  class RelayPool extends Emitter {
    constructor(sid, specs) {
      super();
      this.sid = sid;
      this.relays = [];
      this.seen = new D.SeenSet(4000);
      this.setRelays(specs);
    }
    setRelays(specs) {
      const topics = this.relays.length ? [...this.relays[0].topics.keys()] : [];
      for (const r of this.relays) r.close();
      this.relays = [];
      for (const spec of specs) {
        const p = parseRelay(spec);
        if (!p) continue;
        const Cls = p.kind === 'nostr' ? NostrRelay : p.kind === 'mqtt' ? MqttRelay : TrackerRelay;
        const r = new Cls(p.url, this.sid);
        r.on('message', (topic, payload, from) => {
          const key = topic.slice(0, 8) + payload.slice(0, 40) + payload.length;
          if (!this.seen.add(key)) return;
          this.emit('message', topic, payload, from);
        });
        r.on('status', () => this.emit('status'));
        r.on('wantAnnounce', (topic) => this.emit('wantAnnounce', r, topic));
        this.relays.push(r);
      }
      for (const t of topics) this.subscribe(t);
      this.emit('status');
    }
    subscribe(topic) {
      for (const r of this.relays) r.subscribe(topic);
    }
    unsubscribe(topic) {
      for (const r of this.relays) r.unsubscribe(topic);
    }
    /** Sends to every open relay. Returns the number of relays used. */
    async publish(topic, payload, toSid, only) {
      let n = 0;
      for (const r of only ? [only] : this.relays) {
        if (r.status !== 'open') continue;
        try {
          if (await r.publish(topic, payload, toSid)) n++;
        } catch (e) {
          log.warn('publish', r.host, e);
        }
      }
      return n;
    }
    summary() {
      return this.relays.map((r) => ({ url: r.url, host: r.host, kind: r.kind, status: r.status, error: r.lastError }));
    }
    openCount() {
      return this.relays.filter((r) => r.status === 'open').length;
    }
    close() {
      for (const r of this.relays) r.close();
    }
  }

  D.relays = { DEFAULT_RELAYS, parseRelay, RelayPool, TrackerRelay, NostrRelay, MqttRelay, mqtt };
})();

/* ---- net/mesh.js ---- */
/* Dyad net: WebRTC peers, per-room swarms with gossip, and the network that ties them together. */
(() => {
  'use strict';
  const D = globalThis.Dyad;
  const { Emitter, log, randomId, SeenSet, RateLimiter } = D;

  const MAX_FRAME = 256 * 1024;
  const FULL_MESH = 12;
  const PARTIAL_LINKS = 8;
  const GATHER_MS = 3000;
  const CONNECT_TIMEOUT = 25000;

  /* ---------------- Peer: one RTCPeerConnection + data channel ---------------- */
  class Peer extends Emitter {
    constructor(net, remoteSid, initiator) {
      super();
      this.net = net;
      this.sid = remoteSid;
      this.initiator = initiator;
      this.state = 'connecting';
      this.identity = null;
      this.profile = null;
      this.route = '';
      this.createdAt = Date.now();
      this.limiter = new RateLimiter(40, 120);
      this.pc = new RTCPeerConnection({ iceServers: net.iceServers() });
      this.dc = this.pc.createDataChannel('dyad', { negotiated: true, id: 0, ordered: true });
      this.dc.onopen = () => {
        this.state = 'open';
        clearTimeout(this.timeout);
        this.emit('open');
        this.detectRoute();
      };
      this.dc.onclose = () => this.close('channel closed');
      this.dc.onmessage = (e) => this.onRaw(e.data);
      this.pc.onconnectionstatechange = () => {
        const s = this.pc.connectionState;
        if (s === 'failed' || s === 'closed') this.close('ice ' + s);
        else if (s === 'disconnected') {
          clearTimeout(this.discTimer);
          this.discTimer = setTimeout(() => {
            if (this.pc.connectionState === 'disconnected') this.close('ice disconnected');
          }, 8000);
        }
      };
      this.timeout = setTimeout(() => {
        if (this.state !== 'open') this.close('timeout');
      }, CONNECT_TIMEOUT);
    }
    gather() {
      if (this.pc.iceGatheringState === 'complete') return Promise.resolve();
      return new Promise((resolve) => {
        const done = () => {
          clearTimeout(t);
          this.pc.removeEventListener('icegatheringstatechange', check);
          resolve();
        };
        const check = () => {
          if (this.pc.iceGatheringState === 'complete') done();
        };
        const t = setTimeout(done, GATHER_MS);
        this.pc.addEventListener('icegatheringstatechange', check);
      });
    }
    async makeOffer() {
      await this.pc.setLocalDescription(await this.pc.createOffer());
      await this.gather();
      return this.pc.localDescription.sdp;
    }
    async acceptOffer(sdp) {
      await this.pc.setRemoteDescription({ type: 'offer', sdp });
      await this.pc.setLocalDescription(await this.pc.createAnswer());
      await this.gather();
      return this.pc.localDescription.sdp;
    }
    async acceptAnswer(sdp) {
      if (this.pc.signalingState !== 'have-local-offer') return;
      await this.pc.setRemoteDescription({ type: 'answer', sdp });
    }
    async detectRoute() {
      try {
        const stats = await this.pc.getStats();
        let pairId = null;
        const cands = new Map();
        stats.forEach((r) => {
          if (r.type === 'transport' && r.selectedCandidatePairId) pairId = r.selectedCandidatePairId;
          if (r.type === 'local-candidate' || r.type === 'remote-candidate') cands.set(r.id, r);
        });
        stats.forEach((r) => {
          if (!pairId && r.type === 'candidate-pair' && r.nominated && r.state === 'succeeded') pairId = r.id;
        });
        const pair = pairId && stats.get(pairId);
        const local = pair && cands.get(pair.localCandidateId);
        const t = local && (local.candidateType || local.type);
        this.route = t === 'relay' ? 'turn' : t === 'host' ? 'lan' : t ? 'internet' : 'direct';
        this.emit('route');
      } catch {
        this.route = 'direct';
      }
    }
    onRaw(data) {
      if (typeof data !== 'string' || data.length > MAX_FRAME) return;
      if (!this.limiter.take()) {
        this.floods = (this.floods || 0) + 1;
        if (this.floods > 200) this.close('flooding');
        return;
      }
      let msg;
      try {
        msg = JSON.parse(data);
      } catch {
        return;
      }
      if (msg && typeof msg.t === 'string') this.emit('frame', msg);
    }
    send(obj) {
      if (this.state !== 'open' || this.dc.readyState !== 'open') return false;
      if (this.dc.bufferedAmount > 4 * 1024 * 1024) return false;
      try {
        this.dc.send(JSON.stringify(obj));
        return true;
      } catch (e) {
        log.warn('send failed', e);
        return false;
      }
    }
    close(reason) {
      if (this.state === 'closed') return;
      this.state = 'closed';
      clearTimeout(this.timeout);
      clearTimeout(this.discTimer);
      try {
        this.dc.close();
      } catch {}
      try {
        this.pc.close();
      } catch {}
      log.info('peer closed', this.sid.slice(0, 6), reason || '');
      this.emit('close', reason);
    }
  }

  /* ---------------- Swarm: one room's mesh ---------------- */
  class Swarm extends Emitter {
    /**
     * room: { id, topic, key, kind: 'room'|'dm' }
     * provider: { recentIds(roomId, n), eventsNotIn(roomId, idSet, n) }
     */
    constructor(net, room, provider) {
      super();
      this.net = net;
      this.room = room;
      this.provider = provider;
      this.peers = new Map(); // sid -> Peer
      this.known = new Map(); // sid -> { id, ts, claimed }
      this.seen = new SeenSet(30000);
      this.pending = new Set();
      this.sigSeen = new SeenSet(4000);
      this.badKeys = new Set();
      this.badKeyCount = 0;
      this.lastBroadcast = 0;
      this.started = false;
      this.manual = new Map(); // sid -> Peer for manual invites awaiting reply
    }
    get sid() {
      return this.net.sid;
    }
    start() {
      if (this.started) return;
      this.started = true;
      this.net.pool.subscribe(this.room.topic);
      this.timer = setInterval(() => this.tick(), 15000);
      setTimeout(() => this.announce(), 50);
    }
    stop() {
      if (!this.started) return;
      this.started = false;
      clearInterval(this.timer);
      for (const p of this.peers.values()) {
        p.send({ t: 'bye' });
        p.close('leaving');
      }
      this.peers.clear();
      this.known.clear();
      this.net.pool.unsubscribe(this.room.topic);
      this.emit('peers');
    }
    openPeers() {
      return [...this.peers.values()].filter((p) => p.state === 'open' && p.identity);
    }
    /** Identities currently reachable (directly or through the mesh). */
    onlineIdentities() {
      const now = Date.now();
      const out = new Map();
      for (const p of this.openPeers()) out.set(p.identity, 'direct');
      for (const [sid, k] of this.known) {
        if (sid === this.sid || !k.id || out.has(k.id)) continue;
        if (now - k.ts < 70000 && k.verifiedVia) out.set(k.id, 'relayed');
      }
      return out;
    }
    desiredLinks() {
      return this.known.size + 1 <= FULL_MESH ? Infinity : PARTIAL_LINKS;
    }
    tick() {
      const now = Date.now();
      for (const [sid, k] of this.known) if (now - k.ts > 90000) this.known.delete(sid);
      const lonely = this.openPeers().length === 0;
      if (lonely || now - this.lastBroadcast > 110000) this.announce();
      this.broadcastPeers();
      this.maintain();
      this.emit('peers');
    }
    /** Publish an encrypted hello on relays. */
    async announce(onlyRelay) {
      if (!this.started) return;
      this.lastBroadcast = Date.now();
      const env = { t: 'hello', from: this.sid, id: this.net.identity.id, n: this.openPeers().length };
      try {
        const payload = await D.crypto.seal(this.room.key, env);
        await this.net.pool.publish(this.room.topic, payload, null, onlyRelay);
      } catch (e) {
        log.warn('announce failed', e);
      }
    }
    /** Encrypted signal to one session, over mesh and relays. */
    async signal(toSid, env) {
      env.from = this.sid;
      env.to = toSid;
      env.n = env.n || randomId(10);
      const payload = await D.crypto.seal(this.room.key, env);
      // Mesh delivery is best effort unless we have a direct link to the target, so relays get a copy too
      // (receivers drop duplicates by env.n).
      const viaMesh = this.net.meshSignal(this.room.topic, toSid, payload);
      if (viaMesh !== 'direct') await this.net.pool.publish(this.room.topic, payload, toSid);
    }
    async onRelayMessage(payload, transportSid) {
      let env;
      try {
        env = await D.crypto.open(this.room.key, payload);
      } catch {
        this.badKeyCount++;
        if (transportSid) this.badKeys.add(transportSid);
        this.emit('badkey');
        // Answer with our own hello (rate limited) so the other side learns about the mismatch quickly too.
        if (Date.now() - (this.lastBadKeyHello || 0) > 10000) {
          this.lastBadKeyHello = Date.now();
          this.announce();
        }
        return;
      }
      if (!env || typeof env !== 'object' || typeof env.from !== 'string' || env.from.length !== 20) return;
      if (env.from === this.sid) return;
      if (env.to && env.to !== this.sid) return;
      if (env.n && !this.sigSeen.add(env.n)) return;
      this.handleSignal(env).catch((e) => log.warn('signal', env.t, e));
    }
    async handleSignal(env) {
      const from = env.from;
      if (this.net.isBlocked(from)) return;
      const k = this.known.get(from);
      if (env.t === 'hello') {
        this.known.set(from, { id: k && k.id ? k.id : typeof env.id === 'string' ? env.id : null, ts: Date.now(), verifiedVia: k && k.verifiedVia });
        this.maybeConnect(from);
      } else if (env.t === 'knock') {
        if (k) k.ts = Date.now();
        else this.known.set(from, { id: null, ts: Date.now() });
        this.maybeConnect(from, true);
      } else if (env.t === 'offer' && typeof env.sdp === 'string') {
        if (this.net.noDirect.has(from)) return;
        const existing = this.peers.get(from);
        if (existing && existing.state === 'open') return;
        if (existing && existing.initiator && this.sid < from) return; // we are the designated offerer
        if (existing) existing.close('replaced');
        const peer = this.addPeer(from, false);
        const sdp = await peer.acceptOffer(env.sdp);
        await this.signal(from, { t: 'answer', sdp });
      } else if (env.t === 'answer' && typeof env.sdp === 'string') {
        const peer = this.peers.get(from);
        if (peer && peer.initiator) await peer.acceptAnswer(env.sdp);
      } else if (env.t === 'bye') {
        this.known.delete(from);
        this.emit('peers');
      }
    }
    shouldLink(sid) {
      if (this.peers.has(sid) || sid === this.sid || this.net.isBlocked(sid) || this.net.noDirect.has(sid)) return false;
      return this.openPeers().length < this.desiredLinks() || this.peers.size < 2;
    }
    async maybeConnect(sid, knocked) {
      if (!this.started || !this.shouldLink(sid)) return;
      if (this.sid < sid) {
        const peer = this.addPeer(sid, true);
        try {
          const sdp = await peer.makeOffer();
          if (peer.state === 'closed') return;
          await this.signal(sid, { t: 'offer', sdp });
        } catch (e) {
          peer.close('offer failed');
          log.warn('offer', e);
        }
      } else if (!knocked) {
        await this.signal(sid, { t: 'knock' });
      }
    }
    maintain() {
      for (const sid of this.known.keys()) {
        if (!this.shouldLink(sid)) continue;
        this.maybeConnect(sid);
      }
    }
    addPeer(sid, initiator) {
      const peer = new Peer(this.net, sid, initiator);
      this.peers.set(sid, peer);
      peer.on('open', () => this.onPeerOpen(peer));
      peer.on('frame', (f) => this.onFrame(peer, f));
      peer.on('route', () => this.emit('peers'));
      peer.on('close', () => {
        if (this.peers.get(sid) === peer) this.peers.delete(sid);
        // Forget sessions we only knew through this direct link; peers lists re-add them if still reachable.
        const k = this.known.get(sid);
        if (k && k.verifiedVia === 'direct') this.known.delete(sid);
        this.emit('peers');
        if (peer.identity) this.emit('peerLeft', peer);
      });
      this.emit('peers');
      return peer;
    }
    async onPeerOpen(peer) {
      const hi = { t: 'hi', sess: await this.net.sessEvent(this.room.id), profile: this.net.profileFor(this.room.id) };
      peer.send(hi);
    }
    async onFrame(peer, f) {
      switch (f.t) {
        case 'hi':
          return this.onHi(peer, f);
        case 'ev':
          return this.onEvent(peer, f.e, false);
        case 'evs':
          if (!peer.identity || !Array.isArray(f.list)) return;
          for (const e of f.list.slice(0, 100)) await this.onEvent(peer, e, true);
          return;
        case 'sync':
          return this.onSync(peer, f);
        case 'peers':
          return this.onPeers(peer, f);
        case 'xsig':
          return this.net.onXsig(this, peer, f);
        case 'bye':
          this.known.delete(peer.sid);
          return peer.close('bye');
      }
    }
    async onHi(peer, f) {
      const s = f.sess;
      if (!s || s.k !== 'sess' || s.sid !== peer.sid || s.r !== this.room.id) return peer.close('bad hello');
      if (Math.abs(Date.now() - s.ts) > 15 * 60 * 1000) return peer.close('stale hello');
      if (!(await D.events.accept(s))) return peer.close('bad signature');
      if (this.net.isBlocked(s.a) || (this.room.allow && !this.room.allow.includes(s.a))) return peer.close('not allowed');
      peer.identity = s.a;
      this.known.set(peer.sid, { id: s.a, ts: Date.now(), verifiedVia: 'direct' });
      if (f.profile) await this.onEvent(peer, f.profile, true);
      this.emit('peerJoined', peer);
      this.emit('peers');
      this.broadcastPeers();
      // Ask for what we are missing.
      peer.send({ t: 'sync', ids: this.provider.recentIds(this.room.id, 500) });
    }
    async onSync(peer, f) {
      if (!peer.identity || !Array.isArray(f.ids)) return;
      const have = new Set(f.ids.slice(0, 600).filter((x) => typeof x === 'string'));
      const missing = this.provider.eventsNotIn(this.room.id, have, 500);
      for (let i = 0; i < missing.length; i += 40) {
        peer.send({ t: 'evs', list: missing.slice(i, i + 40) });
        if (i % 200 === 160) await D.sleep(20);
      }
    }
    onPeers(peer, f) {
      if (!peer.identity || !Array.isArray(f.list)) return;
      const now = Date.now();
      for (const item of f.list.slice(0, 64)) {
        if (!item || typeof item.sid !== 'string' || item.sid.length !== 20 || item.sid === this.sid) continue;
        if (this.net.isBlocked(item.sid) || (item.id && this.net.isBlocked(item.id))) continue;
        const k = this.known.get(item.sid);
        this.known.set(item.sid, { id: typeof item.id === 'string' ? item.id : k && k.id, ts: now, verifiedVia: (k && k.verifiedVia) || peer.sid });
      }
      this.maintain();
      this.emit('peers');
    }
    broadcastPeers() {
      const list = this.openPeers().map((p) => ({ sid: p.sid, id: p.identity }));
      for (const p of this.openPeers()) p.send({ t: 'peers', list: list.filter((x) => x.sid !== p.sid) });
    }
    async onEvent(peer, e, synced) {
      if (!e || typeof e !== 'object' || typeof e.id !== 'string') return;
      if (this.seen.has(e.id) || this.pending.has(e.id)) return;
      if (e.r !== this.room.id) return;
      this.pending.add(e.id);
      let ok = false;
      try {
        ok = await D.events.accept(e);
      } finally {
        this.pending.delete(e.id);
      }
      if (!ok) {
        log.warn('dropped invalid event', D.events.invalid(e) || 'signature');
        return;
      }
      if (this.net.isBlocked(e.a)) return;
      if (this.room.allow && !this.room.allow.includes(e.a)) return;
      this.seen.add(e.id);
      this.emit('event', e, { from: peer ? peer.identity : null, synced });
      if (!synced) this.forward(e, peer);
    }
    forward(e, except) {
      for (const p of this.openPeers()) if (p !== except) p.send({ t: 'ev', e });
    }
    /** Publish our own event. Returns number of peers it was sent to. */
    publish(e) {
      this.seen.add(e.id);
      let n = 0;
      for (const p of this.openPeers()) if (p.send({ t: 'ev', e })) n++;
      return n;
    }

    /* ----- Manual invites (no relay) ----- */
    async createManualOffer() {
      const tmpSid = 'm' + randomId(19);
      const peer = new Peer(this.net, tmpSid, true);
      const sdp = await peer.makeOffer();
      this.manual.set(tmpSid, peer);
      setTimeout(() => {
        if (this.manual.get(tmpSid) === peer && peer.state !== 'open') {
          peer.close('invite expired');
          this.manual.delete(tmpSid);
        }
      }, 10 * 60 * 1000);
      peer.timeout && clearTimeout(peer.timeout);
      return { ticket: tmpSid, sdp, peer };
    }
    async acceptManualReply(ticket, remoteSid, sdp) {
      const peer = this.manual.get(ticket);
      if (!peer) throw new Error('This invite has expired. Create a new one.');
      this.manual.delete(ticket);
      peer.sid = remoteSid;
      const old = this.peers.get(remoteSid);
      if (old) old.close('replaced');
      this.adoptPeer(peer);
      await peer.acceptAnswer(sdp);
      peer.timeout = setTimeout(() => {
        if (peer.state !== 'open') peer.close('timeout');
      }, CONNECT_TIMEOUT);
      return peer;
    }
    async answerManual(remoteSid, sdp) {
      const old = this.peers.get(remoteSid);
      if (old) old.close('replaced');
      const peer = this.addPeer(remoteSid, false);
      return peer.acceptOffer(sdp);
    }
    adoptPeer(peer) {
      this.peers.set(peer.sid, peer);
      if (peer.state === 'open') this.onPeerOpen(peer);
      peer.on('open', () => this.onPeerOpen(peer));
      peer.on('frame', (f) => this.onFrame(peer, f));
      peer.on('route', () => this.emit('peers'));
      peer.on('close', () => {
        if (this.peers.get(peer.sid) === peer) this.peers.delete(peer.sid);
        this.emit('peers');
        if (peer.identity) this.emit('peerLeft', peer);
      });
      this.emit('peers');
    }
  }

  /* ---------------- Network: relays + all swarms ---------------- */
  class Network extends Emitter {
    constructor(opts) {
      super();
      this.sid = opts.sid || randomId(20);
      this.identity = opts.identity;
      this.settings = opts.settings || {};
      this.swarms = new Map(); // topic -> Swarm
      this.blocked = new Set();
      this.noDirect = new Set(); // test hook: simulate networks where two sessions cannot link
      this.xsigSeen = new SeenSet(4000);
      this.profiles = new Map(); // roomId -> signed profile event
      this.sessCache = new Map();
      this.pool = new D.relays.RelayPool(this.sid, opts.relays || D.relays.DEFAULT_RELAYS);
      this.pool.on('message', (topic, payload, from) => {
        const s = this.swarms.get(topic);
        if (s) s.onRelayMessage(payload, from);
      });
      this.pool.on('wantAnnounce', (relay, topic) => {
        if (topic) {
          const s = this.swarms.get(topic);
          if (s) s.announce(relay);
        } else {
          for (const s of this.swarms.values()) s.announce(relay);
        }
      });
      this.pool.on('status', () => this.emit('relays'));
    }
    iceServers() {
      const s = this.settings;
      const list = [];
      if (s.stun !== false) list.push({ urls: ['stun:stun.l.google.com:19302', 'stun:stun.cloudflare.com:3478'] });
      if (s.turn && s.turn.url) list.push({ urls: s.turn.url, username: s.turn.user || undefined, credential: s.turn.pass || undefined });
      return list;
    }
    isBlocked(x) {
      return this.blocked.has(x);
    }
    join(room, provider) {
      let s = this.swarms.get(room.topic);
      if (!s) {
        s = new Swarm(this, room, provider);
        this.swarms.set(room.topic, s);
        s.start();
      }
      return s;
    }
    leave(topic) {
      const s = this.swarms.get(topic);
      if (!s) return;
      s.stop();
      this.swarms.delete(topic);
    }
    swarmByRoom(roomId) {
      for (const s of this.swarms.values()) if (s.room.id === roomId) return s;
      return null;
    }
    async sessEvent(roomId) {
      const c = this.sessCache.get(roomId);
      if (c && Date.now() - c.ts < 5 * 60 * 1000) return c;
      const e = await D.events.build(this.identity, roomId, 'sess', { sid: this.sid });
      this.sessCache.set(roomId, e);
      return e;
    }
    profileFor(roomId) {
      return this.profiles.get(roomId) || null;
    }
    /** Route an encrypted signal through any mesh link that can reach the target. */
    meshSignal(topic, toSid, payload) {
      const frame = { t: 'xsig', fid: randomId(12), topic, to: toSid, from: this.sid, data: payload, hops: 0 };
      this.xsigSeen.add(frame.fid);
      return this.routeXsig(frame, null);
    }
    routeXsig(frame, exceptPeer) {
      // Direct link in any swarm?
      for (const s of this.swarms.values()) {
        const p = s.peers.get(frame.to);
        if (p && p.state === 'open' && p.send(frame)) return 'direct';
      }
      if (frame.hops >= 4) return false;
      let sent = false;
      for (const s of this.swarms.values()) {
        if (!s.known.has(frame.to)) continue;
        for (const p of s.openPeers()) {
          if (p === exceptPeer) continue;
          sent = p.send(Object.assign({}, frame, { hops: frame.hops + 1 })) || sent;
        }
      }
      return sent;
    }
    onXsig(swarm, peer, f) {
      if (!peer.identity) return;
      if (typeof f.fid !== 'string' || typeof f.to !== 'string' || typeof f.data !== 'string' || typeof f.topic !== 'string') return;
      if (f.data.length > 16000 || !this.xsigSeen.add(f.fid)) return;
      if (f.to === this.sid) {
        const target = this.swarms.get(f.topic);
        if (target) target.onRelayMessage(f.data, null);
        return;
      }
      this.routeXsig({ t: 'xsig', fid: f.fid, topic: f.topic, to: f.to, from: f.from, data: f.data, hops: (f.hops | 0) }, peer);
    }
    setRelays(list) {
      this.pool.setRelays(list);
    }
    shutdown() {
      for (const s of this.swarms.values()) s.stop();
      this.swarms.clear();
      this.pool.close();
    }
  }

  D.mesh = { Peer, Swarm, Network, FULL_MESH };
})();

/* ---- app/app.js ---- */
/* Dyad app: state, event processing, actions. UI subscribes to `change` events. */
(() => {
  'use strict';
  const D = globalThis.Dyad;
  const { log, Emitter } = D;

  const MAX_PER_ROOM = 5000;
  const SYNC_WINDOW = 500;
  // All pass WCAG AA (4.5:1) with white initials and as name text on a white background.
  const COLORS = ['#4f46e5', '#0369a1', '#0f766e', '#15803d', '#b45309', '#c2410c', '#dc2626', '#be185d', '#7e22ce', '#475569', '#0e7490', '#4d7c0f'];

  const DEFAULT_SETTINGS = {
    theme: 'system',
    accent: 'indigo',
    sound: true,
    receipts: true,
    typing: true,
    enterSend: true,
    notifications: true,
    relays: null, // null = built-in list
    stun: true,
    turn: null,
    compact: false,
  };

  function cmpMsg(a, b) {
    return a.ts - b.ts || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
  }

  class Room {
    constructor(rec) {
      Object.assign(this, rec);
      this.events = new Map();
      this.messages = [];
      this.msgById = new Map();
      this.memberIds = new Set();
      this.reads = new Map();
      this.reactState = new Map(); // target -> Map("a|emoji" -> {on, ts})
      this.typing = new Map();
      this.away = new Map();
      this.pendingOps = new Map();
      this.pendingDmi = [];
      this.metaName = null;
      this.metaTs = 0;
      this.unread = 0;
      this.mentions = 0;
      this.lastActivity = rec.createdAt || 0;
      this.swarm = null;
      this.ver = 0;
      this.lastReadSent = 0;
    }
    get displayName() {
      return this.localName || this.metaName || this.name || this.code || 'Room';
    }
    persisted() {
      const { id, kind, code, password, name, localName, topic, keyRaw, createdAt, muted, notify, autoDelete, peer, pinned, lastRead } = this;
      return { id, kind, code, password, name, localName, topic, keyRaw, createdAt, muted, notify, autoDelete, peer, pinned, lastRead };
    }
  }

  class App extends Emitter {
    constructor() {
      super();
      this.store = null;
      this.identity = null;
      this.me = null; // { name, color, emoji }
      this.settings = Object.assign({}, DEFAULT_SETTINGS);
      this.rooms = new Map();
      this.profiles = new Map(); // identity id -> {id, name, color, emoji, dh, ts}
      this.memberFlags = new Map(); // identity id -> {verified, blocked}
      this.activeRoomId = null;
      this.net = null;
      this.locked = false;
      this.lockInfo = null;
      this.startedAt = Date.now();
      this.test = null;
      this.focused = typeof document !== 'undefined' ? document.hasFocus() : true;
      this.changeQueue = new Set();
      this.changeTimer = null;
    }

    /* ---------------- change notifications (batched per frame) ---------------- */
    changed(scope) {
      this.changeQueue.add(scope);
      if (this.changeTimer) return;
      // requestAnimationFrame does not run in background tabs; fall back to a timer there.
      const hidden = typeof document !== 'undefined' && document.hidden;
      const schedule = !hidden && globalThis.requestAnimationFrame ? globalThis.requestAnimationFrame : (fn) => setTimeout(fn, 60);
      this.changeTimer = schedule(() => {
        this.changeTimer = null;
        const scopes = new Set(this.changeQueue);
        this.changeQueue.clear();
        this.emit('change', scopes);
      });
    }

    /* ---------------- boot ---------------- */
    async boot(testOpts) {
      this.test = testOpts || null;
      this.store = await new D.Store(testOpts && testOpts.db ? testOpts.db : undefined).open();
      this.lockInfo = await this.store.getMeta('lock', true);
      if (this.lockInfo) {
        this.locked = true;
        return 'locked';
      }
      return this.load();
    }
    async unlock(passphrase) {
      const res = await D.crypto.unlock(this.lockInfo, passphrase);
      if (!res) return false;
      this.store.dataKey = res.key;
      this.locked = false;
      res.raw.fill(0);
      await this.load();
      return true;
    }
    async load() {
      const saved = await this.store.getMeta('settings');
      if (saved) Object.assign(this.settings, saved);
      const idRec = await this.store.getMeta('identity');
      if (idRec) {
        try {
          this.identity = await D.crypto.importIdentity(idRec);
        } catch (e) {
          log.error('identity load failed', e);
        }
      }
      this.me = (await this.store.getMeta('profile')) || null;
      for (const m of await this.store.all('members')) this.memberFlags.set(m.key, m);
      const roomRecs = await this.store.all('rooms');
      const evRecs = await this.store.all('events');
      for (const r of roomRecs) this.rooms.set(r.id, new Room(r));
      evRecs.sort((a, b) => a.ts - b.ts);
      for (const rec of evRecs) {
        const room = this.rooms.get(rec.room);
        if (room && rec.e) this.applyEvent(room, rec.e, { loading: true });
      }
      for (const room of this.rooms.values()) {
        room.unread = room.messages.filter((m) => m.ts > (room.lastRead || 0) && m.a !== this.myId && !m.deleted).length;
        this.pruneRoom(room);
      }
      this.activeRoomId = null;
      return this.identity && this.me ? 'ready' : 'onboarding';
    }
    get myId() {
      return this.identity ? this.identity.id : null;
    }

    async createProfile(name, color, emoji) {
      if (!this.identity) {
        this.identity = await D.crypto.createIdentity();
        await this.store.putMeta('identity', await D.crypto.exportIdentity(this.identity));
      }
      await this.updateProfile({ name, color, emoji });
    }
    async updateProfile(p) {
      this.me = Object.assign({ name: 'Me', color: 0, emoji: '' }, this.me || {}, p);
      this.me.name = D.events.cleanName(this.me.name).slice(0, 40) || 'Me';
      await this.store.putMeta('profile', this.me);
      this.profiles.set(this.myId, { id: this.myId, name: this.me.name, color: this.me.color, emoji: this.me.emoji, dh: this.identity.dhpk, ts: Date.now() });
      if (this.net) {
        for (const room of this.rooms.values()) await this.publishProfile(room);
      }
      this.changed('profile');
      this.changed('members');
      this.changed('messages');
    }

    /* ---------------- networking ---------------- */
    startNetwork() {
      if (this.net) return;
      const relays = (this.test && this.test.relays) || this.settings.relays || D.relays.DEFAULT_RELAYS;
      const settings = Object.assign({}, this.settings, this.test && this.test.nostun ? { stun: false } : {});
      this.net = new D.mesh.Network({ identity: this.identity, relays, settings });
      if (this.test && this.test.blocked) for (const b of this.test.blocked) this.net.blocked.add(b);
      for (const [id, f] of this.memberFlags) if (f.blocked) this.net.blocked.add(id);
      this.net.on('relays', () => this.changed('net'));
      for (const room of this.rooms.values()) this.joinSwarm(room);
      this.timer = setInterval(() => this.housekeeping(), 30000);
    }
    stopNetwork() {
      if (!this.net) return;
      clearInterval(this.timer);
      this.net.shutdown();
      this.net = null;
      for (const r of this.rooms.values()) r.swarm = null;
      this.changed('net');
    }
    async joinSwarm(room) {
      if (!this.net || room.swarm) return;
      const sec = await D.crypto.roomFromCache(room.topic, room.keyRaw, room.kind === 'dm' ? 'd' : 'r');
      const swarmRoom = { id: room.id, topic: room.topic, key: sec.key, kind: room.kind };
      if (room.kind === 'dm' && room.peer) swarmRoom.allow = [this.myId, room.peer.id];
      await this.publishProfile(room, true);
      const s = this.net.join(swarmRoom, {
        recentIds: (rid, n) => this.recentIds(rid, n),
        eventsNotIn: (rid, have, n) => this.eventsNotIn(rid, have, n),
      });
      room.swarm = s;
      s.on('event', (e, info) => {
        const changed = this.applyEvent(room, e, info);
        if (changed && !D.events.EPHEMERAL.has(e.k)) this.store.put('events', { id: e.id, room: room.id, ts: e.ts, e });
      });
      s.on('peers', () => {
        this.changed('net');
        this.changed('members');
        this.changed('rooms');
      });
      s.on('peerJoined', (peer) => {
        let changed = false;
        for (const m of room.messages) {
          if (m.a === this.myId && m.status === 'pending') {
            m.status = 'sent';
            m.ver++;
            changed = true;
          }
        }
        if (changed) this.changed('messages');
        this.seedDmSwarms(peer.identity, peer.sid);
      });
      s.on('badkey', () => this.changed('net'));
      if (room.kind === 'dm' && room.peer) this.seedDmFrom(room);
    }
    /** When a DM partner shows up in any room, point the DM swarm at their session. */
    seedDmSwarms(identityId, sid) {
      for (const room of this.rooms.values()) {
        if (room.kind !== 'dm' || !room.peer || room.peer.id !== identityId || !room.swarm) continue;
        if (!room.swarm.known.has(sid)) room.swarm.known.set(sid, { id: identityId, ts: Date.now() });
        room.swarm.maybeConnect(sid);
      }
    }
    seedDmFrom(dmRoom) {
      for (const r of this.rooms.values()) {
        if (!r.swarm || r === dmRoom) continue;
        for (const p of r.swarm.openPeers()) if (p.identity === dmRoom.peer.id) this.seedDmSwarms(p.identity, p.sid);
        for (const [sid, k] of r.swarm.known) if (k.id === dmRoom.peer.id) this.seedDmSwarms(k.id, sid);
      }
    }
    async publishProfile(room, quiet) {
      if (!this.identity || !this.me) return;
      const e = await D.events.build(this.identity, room.id, 'profile', {
        n: this.me.name,
        c: this.me.color | 0,
        em: this.me.emoji || '',
        dh: this.identity.dhpk,
      });
      this.applyEvent(room, e, { local: true });
      this.store.put('events', { id: e.id, room: room.id, ts: e.ts, e });
      if (this.net) this.net.profiles.set(room.id, e);
      if (!quiet && room.swarm) room.swarm.publish(e);
    }
    recentIds(roomId, n) {
      const room = this.rooms.get(roomId);
      if (!room) return [];
      return this.syncable(room).slice(0, n).map((e) => e.id);
    }
    eventsNotIn(roomId, have, n) {
      const room = this.rooms.get(roomId);
      if (!room) return [];
      const all = this.syncable(room);
      const pick = all.slice(0, n);
      // Room name and member profiles always travel, even when older than the sync window.
      for (const e of all.slice(n)) if (e.k === 'meta' || e.k === 'profile') pick.push(e);
      return pick.filter((e) => !have.has(e.id)).reverse();
    }
    /** Stored events of a room, newest first (index entries skipped). */
    syncable(room) {
      const out = [];
      for (const [k, e] of room.events) if (k === e.id) out.push(e);
      return out.sort((a, b) => b.ts - a.ts);
    }

    /* ---------------- event processing ---------------- */
    profileOf(id) {
      return this.profiles.get(id) || { id, name: 'Unknown', color: 9, emoji: '', unknown: true };
    }
    nameOf(id) {
      return id === this.myId ? (this.me ? this.me.name : 'You') : this.profileOf(id).name;
    }
    /** Returns true if the event changed state (and should be stored when it is a stored kind). */
    applyEvent(room, e, info = {}) {
      if (room.events.has(e.id)) return false;
      const stored = D.events.STORED.has(e.k);
      if (stored && room.autoDelete && e.ts < Date.now() - room.autoDelete * 86400000) return false;
      if (e.a !== this.myId && this.memberFlags.get(e.a) && this.memberFlags.get(e.a).blocked) return false;
      const mine = e.a === this.myId;
      if (e.k !== 'typing' && e.k !== 'away' && e.k !== 'sess') room.memberIds.add(e.a);
      switch (e.k) {
        case 'msg': {
          if (room.msgById.has(e.id)) return false;
          room.events.set(e.id, e);
          const m = { id: e.id, a: e.a, ts: e.ts, text: e.text, rp: e.rp || null, m: e.m || [], edited: false, editTs: 0, deleted: false, ver: 0, status: mine ? info.status || 'sent' : null };
          const arr = room.messages;
          let lo = 0;
          let hi = arr.length;
          while (lo < hi) {
            const mid = (lo + hi) >> 1;
            if (cmpMsg(arr[mid], m) < 0) lo = mid + 1;
            else hi = mid;
          }
          arr.splice(lo, 0, m);
          room.msgById.set(e.id, m);
          room.lastActivity = Math.max(room.lastActivity, e.ts);
          if (room.typing.delete(e.a)) this.changed('typing');
          const ops = room.pendingOps.get(e.id);
          if (ops) {
            room.pendingOps.delete(e.id);
            for (const op of ops.sort((a, b) => a.ts - b.ts)) this.applyOp(room, op, m);
          }
          if (!mine && !info.loading) this.onIncomingMessage(room, m, info);
          this.changed('messages');
          this.changed('rooms');
          return true;
        }
        case 'edit':
        case 'del':
        case 'react': {
          room.events.set(e.id, e);
          const target = room.msgById.get(e.t);
          if (!target) {
            if (!room.pendingOps.has(e.t)) room.pendingOps.set(e.t, []);
            room.pendingOps.get(e.t).push(e);
            return true;
          }
          this.applyOp(room, e, target);
          this.changed('messages');
          return true;
        }
        case 'profile': {
          const prev = room.events.get('p|' + e.a);
          if (prev && prev.ts >= e.ts) return false;
          if (prev) {
            room.events.delete(prev.id);
            room.events.delete('p|' + e.a);
            if (!info.loading) this.store.del('events', prev.id);
          }
          room.events.set(e.id, e);
          room.events.set('p|' + e.a, e); // index entry (not synced: filtered below)
          const cur = this.profiles.get(e.a);
          if (!cur || cur.ts < e.ts) this.profiles.set(e.a, { id: e.a, name: D.events.cleanName(e.n), color: e.c, emoji: D.events.cleanName(e.em), dh: e.dh, ts: e.ts });
          this.flushDmi(room);
          this.changed('members');
          this.changed('messages');
          this.changed('rooms');
          return true;
        }
        case 'meta': {
          if (e.ts <= room.metaTs) return false;
          const prev = room.metaEvent;
          if (prev) {
            room.events.delete(prev.id);
            if (!info.loading) this.store.del('events', prev.id);
          }
          room.metaEvent = e;
          room.metaTs = e.ts;
          room.metaName = e.n;
          room.events.set(e.id, e);
          this.changed('rooms');
          return true;
        }
        case 'read': {
          const key = 'rd|' + e.a;
          const prev = room.events.get(key);
          if (prev && prev.up >= e.up) return false;
          if (prev) {
            room.events.delete(prev.id);
            room.events.delete(key);
            if (!info.loading) this.store.del('events', prev.id);
          }
          room.events.set(e.id, e);
          room.events.set(key, e);
          room.reads.set(e.a, e.up);
          this.changed('messages');
          return true;
        }
        case 'dmi': {
          room.events.set(e.id, e);
          if (e.to === this.myId && e.a !== this.myId) {
            room.pendingDmi.push(e.a);
            this.flushDmi(room);
          }
          return true;
        }
        case 'typing':
          if (mine) return false;
          room.typing.set(e.a, Date.now() + 6000);
          this.changed('typing');
          setTimeout(() => this.changed('typing'), 6100);
          return false;
        case 'away':
          room.away.set(e.a, e.on);
          this.changed('members');
          return false;
      }
      return false;
    }
    applyOp(room, op, target) {
      if (op.k === 'edit') {
        if (op.a !== target.a || target.deleted || op.ts <= target.editTs) return;
        target.text = op.text;
        target.m = op.m || [];
        target.edited = true;
        target.editTs = op.ts;
        target.ver++;
      } else if (op.k === 'del') {
        if (op.a !== target.a) return;
        target.deleted = true;
        target.text = '';
        target.ver++;
        // Remove the original text and its edits from local storage.
        const orig = room.events.get(target.id);
        if (orig) {
          room.events.delete(orig.id);
          this.store.del('events', orig.id);
        }
        for (const [id, ev] of room.events) {
          if (ev.k === 'edit' && ev.t === target.id) {
            room.events.delete(id);
            this.store.del('events', id);
          }
        }
      } else if (op.k === 'react') {
        if (!room.reactState.has(target.id)) room.reactState.set(target.id, new Map());
        const st = room.reactState.get(target.id);
        const key = op.a + '|' + op.e;
        const prev = st.get(key);
        if (prev && prev.ts >= op.ts) return;
        if (prev && prev.id) {
          room.events.delete(prev.id);
          this.store.del('events', prev.id);
        }
        st.set(key, { on: op.on, ts: op.ts, id: op.id });
        target.ver++;
      }
    }
    isBlocked(id) {
      const f = this.memberFlags.get(id);
      return !!(f && f.blocked);
    }
    visibleMessages(room) {
      return room.messages.filter((m) => m.a === this.myId || !this.isBlocked(m.a));
    }
    reactionsOf(room, msgId) {
      const st = room.reactState.get(msgId);
      const out = new Map();
      if (!st) return out;
      for (const [key, v] of st) {
        if (!v.on) continue;
        const i = key.indexOf('|');
        const a = key.slice(0, i);
        const emoji = key.slice(i + 1);
        if (!out.has(emoji)) out.set(emoji, []);
        out.get(emoji).push(a);
      }
      return out;
    }
    async flushDmi(room) {
      if (!room.pendingDmi.length) return;
      const still = [];
      for (const from of room.pendingDmi) {
        const p = this.profiles.get(from);
        if (!p || !p.dh) {
          still.push(from);
          continue;
        }
        await this.ensureDm(from, p.dh, false);
      }
      room.pendingDmi = still;
    }
    onIncomingMessage(room, m, info) {
      const active = this.activeRoomId === room.id && this.focused && !document.hidden;
      if (!active) {
        room.unread++;
        if (m.m.includes(this.myId)) room.mentions++;
      }
      const old = m.ts < this.startedAt - 60000;
      if (!active && !info.synced && !old) this.emit('notify', room, m);
    }
    notifyMode(room) {
      if (room.muted) return 'none';
      if (room.notify) return room.notify;
      return room.kind === 'dm' || room.memberIds.size <= 8 ? 'all' : 'mentions';
    }

    /* ---------------- rooms ---------------- */
    async createOrJoinRoom({ code, password = '', name = '' }) {
      const sec = await D.crypto.deriveRoom(code, password);
      let room = this.rooms.get(sec.roomId);
      if (room && room.keyRaw !== sec.keyRaw) {
        // Same code, different password: replace key.
        this.leaveSwarm(room);
        room.keyRaw = sec.keyRaw;
        room.password = password;
      }
      if (!room) {
        room = new Room({ id: sec.roomId, kind: 'room', code: sec.code, password, name: name || '', topic: sec.topic, keyRaw: sec.keyRaw, createdAt: Date.now(), lastRead: 0 });
        this.rooms.set(room.id, room);
      }
      this.saveRoom(room);
      if (name) await this.renameRoomShared(room, name);
      if (this.net) await this.joinSwarm(room);
      this.changed('rooms');
      return room;
    }
    async ensureDm(otherId, otherDh, open = true) {
      const sec = await D.crypto.deriveDm(this.identity, otherId, otherDh);
      let room = this.rooms.get(sec.roomId);
      if (!room) {
        room = new Room({ id: sec.roomId, kind: 'dm', topic: sec.topic, keyRaw: sec.keyRaw, peer: { id: otherId, dh: otherDh }, createdAt: Date.now(), lastRead: 0 });
        this.rooms.set(room.id, room);
        room.memberIds.add(otherId);
        this.saveRoom(room);
        if (this.net) await this.joinSwarm(room);
        this.changed('rooms');
      }
      if (open) this.setActive(room.id);
      return room;
    }
    async openDm(otherId, viaRoom) {
      const p = this.profiles.get(otherId);
      if (!p || !p.dh) throw new Error('This member has not shared their profile yet. Try again in a moment.');
      const room = await this.ensureDm(otherId, p.dh, true);
      // Tell them through the shared room so their app opens the DM too.
      const shared = viaRoom || [...this.rooms.values()].find((r) => r.kind === 'room' && r.memberIds.has(otherId));
      if (shared && !room.invited) {
        room.invited = true;
        const e = await D.events.build(this.identity, shared.id, 'dmi', { to: otherId });
        this.applyEvent(shared, e, { local: true });
        this.store.put('events', { id: e.id, room: shared.id, ts: e.ts, e });
        if (shared.swarm) shared.swarm.publish(e);
      }
      return room;
    }
    dmTitle(room) {
      return room.peer ? this.nameOf(room.peer.id) : 'Direct message';
    }
    roomTitle(room) {
      return room.kind === 'dm' ? this.dmTitle(room) : room.displayName;
    }
    saveRoom(room) {
      this.store.put('rooms', room.persisted());
    }
    async renameRoomShared(room, name) {
      name = String(name).trim().slice(0, 60);
      if (!name) return;
      const e = await D.events.build(this.identity, room.id, 'meta', { n: name });
      this.applyEvent(room, e, { local: true });
      this.store.put('events', { id: e.id, room: room.id, ts: e.ts, e });
      if (room.swarm) room.swarm.publish(e);
    }
    updateRoom(room, patch) {
      Object.assign(room, patch);
      this.saveRoom(room);
      this.changed('rooms');
      this.changed('room');
    }
    leaveSwarm(room) {
      if (this.net && room.swarm) this.net.leave(room.topic);
      room.swarm = null;
    }
    async leaveRoom(room, deleteHistory = true) {
      this.leaveSwarm(room);
      this.rooms.delete(room.id);
      this.store.del('rooms', room.id);
      if (deleteHistory) for (const id of room.events.keys()) if (!id.includes('|')) this.store.del('events', id);
      if (this.activeRoomId === room.id) this.activeRoomId = null;
      this.changed('rooms');
      this.changed('room');
    }
    clearHistory(room) {
      for (const [id, e] of room.events) {
        if (e.k === 'profile' || e.k === 'meta') continue;
        room.events.delete(id);
        if (!id.includes('|')) this.store.del('events', id);
      }
      room.messages = [];
      room.msgById.clear();
      room.reactState.clear();
      room.pendingOps.clear();
      this.changed('messages');
      this.changed('rooms');
    }
    setActive(roomId) {
      this.activeRoomId = roomId;
      const room = this.rooms.get(roomId);
      if (room) {
        room.unread = 0;
        room.mentions = 0;
        this.markRead(room);
      }
      this.changed('room');
      this.changed('rooms');
      this.changed('messages');
    }
    markRead(room) {
      const last = room.messages.length ? room.messages[room.messages.length - 1] : null;
      if (!last) return;
      if ((room.lastRead || 0) < last.ts) {
        room.lastRead = last.ts;
        this.saveRoom(room);
      }
      room.unread = 0;
      room.mentions = 0;
      if (this.settings.receipts && last.ts > room.lastReadSent && last.a !== this.myId) {
        room.lastReadSent = last.ts;
        clearTimeout(room.readTimer);
        room.readTimer = setTimeout(async () => {
          const e = await D.events.build(this.identity, room.id, 'read', { up: last.ts });
          this.applyEvent(room, e, { local: true });
          this.store.put('events', { id: e.id, room: room.id, ts: e.ts, e });
          if (room.swarm) room.swarm.publish(e);
        }, 800);
      }
      this.changed('rooms');
    }

    /* ---------------- messaging ---------------- */
    async sendMessage(room, text, replyTo) {
      text = String(text).replace(/\s+$/, '');
      if (!D.events.hasVisibleText(text)) return null;
      if (text.length > D.events.MAX_TEXT) throw new Error('Messages can be up to ' + D.events.MAX_TEXT + ' characters.');
      const members = [...room.memberIds].map((id) => this.profileOf(id));
      const fields = { text };
      if (replyTo) fields.rp = replyTo;
      const m = D.events.findMentions(text, members);
      if (m.length) fields.m = m;
      const e = await D.events.build(this.identity, room.id, 'msg', fields);
      const n = room.swarm ? room.swarm.publish(e) : 0;
      this.applyEvent(room, e, { local: true, status: n > 0 ? 'sent' : 'pending' });
      this.store.put('events', { id: e.id, room: room.id, ts: e.ts, e });
      room.lastRead = e.ts;
      this.saveRoom(room);
      this.store.flush();
      return e;
    }
    async editMessage(room, msgId, text) {
      const target = room.msgById.get(msgId);
      if (!target || target.a !== this.myId || target.deleted) return;
      text = String(text).replace(/\s+$/, '');
      if (!text.trim() || text === target.text) return;
      const members = [...room.memberIds].map((id) => this.profileOf(id));
      const fields = { t: msgId, text };
      const m = D.events.findMentions(text, members);
      if (m.length) fields.m = m;
      await this.publishLocal(room, 'edit', fields);
    }
    async deleteMessage(room, msgId) {
      const target = room.msgById.get(msgId);
      if (!target || target.a !== this.myId) return;
      await this.publishLocal(room, 'del', { t: msgId });
    }
    async toggleReaction(room, msgId, emoji) {
      const st = room.reactState.get(msgId);
      const cur = st && st.get(this.myId + '|' + emoji);
      await this.publishLocal(room, 'react', { t: msgId, e: emoji, on: !(cur && cur.on) });
    }
    async publishLocal(room, kind, fields) {
      const e = await D.events.build(this.identity, room.id, kind, fields);
      if (room.swarm) room.swarm.publish(e);
      if (this.applyEvent(room, e, { local: true }) && D.events.STORED.has(kind)) {
        this.store.put('events', { id: e.id, room: room.id, ts: e.ts, e });
      }
      return e;
    }
    async sendTyping(room) {
      if (!this.settings.typing || !room.swarm || !room.swarm.openPeers().length) return;
      const now = Date.now();
      if (room.lastTypingSent && now - room.lastTypingSent < 3000) return;
      room.lastTypingSent = now;
      const e = await D.events.build(this.identity, room.id, 'typing', {});
      room.swarm.publish(e);
    }
    async setAway(on) {
      if (!this.net) return;
      for (const room of this.rooms.values()) {
        if (!room.swarm || !room.swarm.openPeers().length) continue;
        const e = await D.events.build(this.identity, room.id, 'away', { on });
        room.swarm.publish(e);
      }
    }
    typingNames(room) {
      const now = Date.now();
      const out = [];
      for (const [id, until] of room.typing) {
        if (until > now) out.push(this.nameOf(id));
        else room.typing.delete(id);
      }
      return out;
    }
    readersOf(room, m) {
      if (!this.settings.receipts) return [];
      const out = [];
      for (const [id, up] of room.reads) if (id !== m.a && up >= m.ts) out.push(id);

    /* ---------------- members ---------------- */
    membersOf(room) {
      const online = room.swarm ? room.swarm.onlineIdentities() : new Map();
      const ids = new Set(room.memberIds);
      ids.add(this.myId);
      for (const id of online.keys()) ids.add(id);
      if (room.kind === 'dm' && room.peer) ids.add(room.peer.id);
      const out = [];
      for (const id of ids) {
        const p = this.profileOf(id);
        const flags = this.memberFlags.get(id) || {};
        const me = id === this.myId;
        const status = me ? (this.net ? 'online' : 'offline') : online.has(id) ? (room.away.get(id) ? 'away' : 'online') : 'offline';
        out.push({ id, name: me ? this.me.name : p.name, color: me ? this.me.color : p.color, emoji: me ? this.me.emoji : p.emoji, me, status, route: online.get(id) || null, verified: !!flags.verified, blocked: !!flags.blocked, dh: p.dh });
      }
      const rank = { online: 0, away: 1, offline: 2 };
      out.sort((a, b) => (a.me ? -1 : b.me ? 1 : 0) || rank[a.status] - rank[b.status] || a.name.localeCompare(b.name));

    }
    setMemberFlag(id, patch) {
      const cur = Object.assign({ key: id }, this.memberFlags.get(id) || {}, patch);
      this.memberFlags.set(id, cur);

      if (this.net) {
        if (cur.blocked) {
          this.net.blocked.add(id);
          for (const room of this.rooms.values()) {
            if (!room.swarm) continue;
            for (const p of room.swarm.openPeers()) if (p.identity === id) p.close('blocked');
          }

      this.changed('messages');
    }

    async createInvite(room) {
      if (!room.swarm) throw new Error('Not connected yet.');
      const { ticket, sdp } = await room.swarm.createManualOffer();
      const payload = { v: 1, k: 'inv', room: { code: room.code, pw: room.password || '', n: room.displayName }, sid: this.net.sid, tk: ticket, sdp };

    }
    static async decodeCode(code) {
      const m = /DYAD1\.([A-Za-z0-9_-]+)/.exec(String(code).replace(/\s+/g, ''));
      if (!m) throw new Error('That does not look like a Dyad code.');
      let obj;
      try {
        obj = JSON.parse(await D.crypto.inflate(D.unb64u(m[1])));
      } catch {
        throw new Error('This code is damaged or incomplete. Copy it again.');
      }
      if (!obj || obj.v !== 1 || typeof obj.sdp !== 'string' || typeof obj.sid !== 'string' || obj.sid.length !== 20) throw new Error('This code is not valid.');
      return obj;
    }
    /** Accept an invite: join the room, answer the offer, return the reply code. */
    async acceptInvite(code) {
      const inv = await App.decodeCode(code);
      if (inv.k !== 'inv' || !inv.room || typeof inv.room.code !== 'string') throw new Error('This is a reply code. Paste it on the device that made the invite.');
      const room = await this.createOrJoinRoom({ code: inv.room.code, password: inv.room.pw || '' });
      if (inv.room.n && !room.metaName && !room.name) this.updateRoom(room, { name: String(inv.room.n).slice(0, 60) });
      if (!room.swarm) await this.joinSwarm(room);
      const sdp = await room.swarm.answerManual(inv.sid, inv.sdp);
      const reply = { v: 1, k: 'rep', sid: this.net.sid, tk: inv.tk, sdp };
      return { room, code: 'DYAD1.' + D.b64u(await D.crypto.deflate(JSON.stringify(reply))) };
    }
    async acceptReply(room, code) {
      const rep = await App.decodeCode(code);
      if (rep.k !== 'rep') throw new Error('This is an invite code. Paste it on the other device.');
      await room.swarm.acceptManualReply(rep.tk, rep.sid, rep.sdp);
    }

    async saveSettings(patch) {
      const before = Object.assign({}, this.settings);
      Object.assign(this.settings, patch);
      await this.store.putMeta('settings', this.settings);
      if (this.net) {
        Object.assign(this.net.settings, this.settings);
        if (JSON.stringify(before.relays) !== JSON.stringify(this.settings.relays)) {

      }
      this.changed('settings');
    }

    /* ---------------- history lock ---------------- */
    async enableLock(passphrase) {
      const { lock, dataKey } = await D.crypto.createLock(passphrase);
      await this.store.putMetaNow('lock', lock);
      await this.store.rewriteAll(dataKey);
      this.lockInfo = lock;
      this.changed('settings');
    }
    async disableLock(passphrase) {
      const res = await D.crypto.unlock(this.lockInfo, passphrase);
      if (!res) return false;
      await this.store.rewriteAll(null);
      const tx = this.store.db.transaction('meta', 'readwrite');
      tx.objectStore('meta').delete('lock');
      await new Promise((r) => (tx.oncomplete = r));
      this.lockInfo = null;
      this.changed('settings');
      return true;
    }
    async changeLock(oldPass, newPass) {
      const res = await D.crypto.unlock(this.lockInfo, oldPass);
      if (!res) return false;
      const lock = await D.crypto.rewrapLock(res.raw, newPass);
      res.raw.fill(0);
      await this.store.putMetaNow('lock', lock);
      this.lockInfo = lock;
      return true;
    }

    /* ---------------- backup ---------------- */
    async exportBackup(passphrase, roomId) {
      await this.store.flush();
      const rooms = [...this.rooms.values()].filter((r) => !roomId || r.id === roomId).map((r) => r.persisted());
      const ids = new Set(rooms.map((r) => r.id));
      const events = (await this.store.all('events')).filter((e) => ids.has(e.room));
      const payload = {
        v: 1,
        exported: Date.now(),
        identity: await D.crypto.exportIdentity(this.identity),
        profile: this.me,
        settings: this.settings,
        rooms,
        events,
        members: [...this.memberFlags.values()],
      };
      return D.crypto.encryptBackup(passphrase, payload);
    }
    async readBackup(passphrase, file) {
      const data = await D.crypto.decryptBackup(passphrase, file);
      if (!data || data.v !== 1 || !Array.isArray(data.rooms) || !Array.isArray(data.events)) throw new Error('This backup is damaged.');
      return data;
    }
    /** Merges a decrypted backup. replaceIdentity moves this device to the backup's identity. */
    async importBackup(data, replaceIdentity) {
      if (replaceIdentity && data.identity) {
        await D.crypto.importIdentity(data.identity); // validates
        await this.store.putMeta('identity', data.identity);
        if (data.profile) await this.store.putMeta('profile', data.profile);
      }
      for (const r of data.rooms) {
        if (!r || typeof r.id !== 'string' || typeof r.topic !== 'string' || typeof r.keyRaw !== 'string') continue;
        if (!this.rooms.has(r.id)) this.store.put('rooms', r);
      }
      for (const ev of data.events) {
        if (ev && ev.id && ev.room && ev.e && D.events.invalid(ev.e) === null) this.store.put('events', ev);
      }
      for (const m of data.members || []) if (m && m.key) this.store.put('members', m);
      await this.store.flush();
    }
    async wipeAll() {
      this.stopNetwork();
      await this.store.wipe();
    }

    /* ---------------- maintenance ---------------- */
    pruneRoom(room) {
      const now = Date.now();
      const cutoff = room.autoDelete ? now - room.autoDelete * 86400000 : 0;
      let removed = false;
      while (room.messages.length && (room.messages.length > MAX_PER_ROOM || (cutoff && room.messages[0].ts < cutoff))) {
        const m = room.messages.shift();
        room.msgById.delete(m.id);
        room.events.delete(m.id);
        this.store.del('events', m.id);
        for (const [id, e] of room.events) {
          if ((e.k === 'edit' || e.k === 'react' || e.k === 'del') && e.t === m.id) {
            room.events.delete(id);
            this.store.del('events', id);
          }
        }
        room.reactState.delete(m.id);
        removed = true;
      }
      if (removed) this.changed('messages');
    }
    housekeeping() {
      for (const room of this.rooms.values()) this.pruneRoom(room);
    }
    roomStatus(room) {
      if (!this.net || !room.swarm) return { state: 'offline', peers: 0 };
      const peers = room.swarm.openPeers().length;
      const online = room.swarm.onlineIdentities().size;
      if (peers > 0) return { state: 'connected', peers, online };
      const relaysOpen = this.net.pool.openCount();
      if (room.swarm.badKeyCount > 0) return { state: 'wrongkey', peers: 0, relaysOpen };
      return { state: relaysOpen ? 'searching' : 'norelay', peers: 0, relaysOpen };
    }
  }

  D.App = App;
  D.COLORS = COLORS;
  D.DEFAULT_SETTINGS = DEFAULT_SETTINGS;
})();

    /* ---------------- messages ---------------- */
    atBottom() {
      const s = this.msgScroll;
      return s.scrollHeight - s.scrollTop - s.clientHeight < 80;

    scrollToBottom(smooth) {
