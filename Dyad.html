    onScroll() {
      const room = this.room;
      if (!room) return;
      if (this.msgScroll.scrollTop < 120 && room.messages.length > this.limit && !this.loadingOlder) {
        this.loadingOlder = true;
        const before = this.msgScroll.scrollHeight;
        this.limit += PAGE;
        this.renderMessages();
        this.msgScroll.scrollTop += this.msgScroll.scrollHeight - before;
        this.loadingOlder = false;
      }
      if (this.atBottom()) {
        this.jumpBtn.classList.add('hidden');
        if (room.unread && document.hasFocus()) this.app.markRead(room);
      }
    }
    renderMessages(initial) {
      const app = this.app;
      const room = this.room;
      if (!room) {
        clear(this.msgList).appendChild(this.welcome());
        return;
      }
      const wasBottom = initial || this.atBottom();
      const msgs = app.visibleMessages(room);
      const start = Math.max(0, msgs.length - this.limit);
      const frag = document.createDocumentFragment();
      if (start === 0 && (room.kind === 'dm' || msgs.length < 450)) frag.appendChild(this.roomIntro(room));
      else if (start === 0) frag.appendChild(h('div.day', 'Start of the history on this device'));
      else frag.appendChild(h('div.day', 'Scroll up for older messages'));
      let prev = null;
      let lastMine = null;
      for (let i = msgs.length - 1; i >= start; i--) {
        if (msgs[i].a === app.myId && !msgs[i].deleted) {
          lastMine = msgs[i];
          break;
        }
      }
      let markerDone = false;
      const seen = new Set();
      for (let i = start; i < msgs.length; i++) {
        const m = msgs[i];
        const newDay = !prev || new Date(prev.ts).toDateString() !== new Date(m.ts).toDateString();
        if (newDay) frag.appendChild(h('div.day', { role: 'separator' }, dayLabel(m.ts)));
        if (!markerDone && this.newMarkerTs && m.ts > this.newMarkerTs && m.a !== app.myId) {
          markerDone = true;
          frag.appendChild(h('div.new-line', 'New'));
        }
        const grouped = !!(prev && !newDay && prev.a === m.a && m.ts - prev.ts < GROUP_MS && !m.rp && !prev.deleted);
        frag.appendChild(this.msgNode(room, m, !grouped, m === lastMine));
        seen.add(m.id);
        prev = m;
      }
      for (const id of this.nodeCache.keys()) if (!seen.has(id)) this.nodeCache.delete(id);
      const added = msgs.length && this.lastCount !== undefined && msgs.length > this.lastCount && this.lastRoom === room.id;
      const lastIsMine = msgs.length && msgs[msgs.length - 1].a === app.myId;
      this.lastCount = msgs.length;
      this.lastRoom = room.id;
      clear(this.msgList).appendChild(frag);
      if (wasBottom || (added && lastIsMine)) {
        this.scrollToBottom(false);
        if (document.hasFocus() && !document.hidden) app.markRead(room);
      } else if (added) this.jumpBtn.classList.remove('hidden');
    }
    welcome() {

    msgNode(room, m, first, isLastMine) {

        }

        content.appendChild(row);

    renderMd(nodes, parent, room) {
      for (const n of nodes) {

          case 'br':
            parent.appendChild(document.createTextNode('\n'));
            break;
          case 'b':
            this.renderMd(n.c, parent.appendChild(h('strong')), room);
            break;
          case 'i':
            this.renderMd(n.c, parent.appendChild(h('em')), room);
            break;
          case 's':
            this.renderMd(n.c, parent.appendChild(h('del')), room);
            break;
          case 'code':
            parent.appendChild(h('code', n.v));
            break;
          case 'pre':

    /* ---------------- composer ---------------- */

      this.emojiBtn = h('button.icon-btn', { 'aria-label': 'Insert emoji', title: 'Emoji', onclick: () => UI.emoji.picker(this.emojiBtn, (e) => this.insertText(e), { above: true }) }, icon('smile'));

    renderComposer() {
      const room = this.room;
      this.composerWrap.classList.toggle('hidden', !room);
      this.typingEl.classList.toggle('hidden', !room);
      if (!room) return;
      const placeholder = room.kind === 'dm' ? 'Message ' + this.app.dmTitle(room) : 'Message #' + room.displayName;
      this.input.placeholder = placeholder;
      this.input.value = this.drafts.get(room.id) || '';
      this.footEl.firstChild.textContent = this.app.settings.enterSend ? 'Enter to send · Shift+Enter for a new line · **bold** *italic* `code`' : 'Ctrl+Enter to send · **bold** *italic* `code`';

      this.onInput(true);
    }
    saveDraft() {

    }
    renderCtx() {
      clear(this.ctxEl);
      const app = this.app;
      const room = this.room;
      if (this.editing) {
        this.ctxEl.appendChild(h('div.ctx', icon('edit', 'sm'), h('span', h('b', 'Editing message'), ' · Esc to cancel'), h('button.icon-btn.sm', { 'aria-label': 'Cancel edit', onclick: () => this.cancelCtx() }, icon('x', 'sm'))));
      } else if (this.reply && room) {
        const m = room.msgById.get(this.reply);

      this.renderCtx();
      this.onInput(true);
      this.input.focus();
    }
    startReply(m) {
      this.editing = null;
      this.reply = m.id;
      this.renderCtx();
      this.input.focus();
    }
    startEdit(m) {
      this.saveDraft();
      this.reply = null;
      this.editing = m.id;
      this.input.value = m.text;
      this.renderCtx();
      this.onInput(true);
      this.input.focus();
      this.input.setSelectionRange(this.input.value.length, this.input.value.length);
    }
    autosize() {
      this.input.style.height = 'auto';
      this.input.style.height = Math.min(220, this.input.scrollHeight) + 'px';
    }
    onInput(silent) {
      const v = this.input.value;
      this.sendBtn.disabled = !D.events.hasVisibleText(v) || v.length > D.events.MAX_TEXT;
      this.autosize();
      const left = D.events.MAX_TEXT - v.length;
      this.countEl.textContent = left < 500 ? String(left) : '';
      this.countEl.classList.toggle('over', left < 0);
      if (!silent && this.room && v.trim() && !this.editing) this.app.sendTyping(this.room);
      this.updateMentions();
    }
    updateMentions() {
      const room = this.room;
      const v = this.input.value.slice(0, this.input.selectionStart);
      const m = /(^|\s)@([\p{L}\p{N}_.-]{0,30})$/u.exec(v);
      if (!room || !m) return this.closeMentions();
      const q = m[2].toLowerCase();
      const list = this.app.membersOf(room).filter((x) => !x.me && x.name.toLowerCase().replace(/\s+/g, '').startsWith(q)).slice(0, 6);
      if (!list.length) return this.closeMentions();
      this.mentionSel = Math.min(this.mentionSel || 0, list.length - 1);
      this.mentionList = list;
      this.mentionQuery = m[2];
      if (!this.mentionPop) {
        this.mentionPop = h('div.mention-pop', { role: 'listbox' });
        this.composerWrap.appendChild(this.mentionPop);
      }
      clear(this.mentionPop);
      list.forEach((mem, i) => this.mentionPop.appendChild(h('button' + (i === this.mentionSel ? '.on' : ''), { role: 'option', onmousedown: (e) => { e.preventDefault(); this.pickMention(i); } }, avatar(mem, 'xs'), h('span', mem.name))));
    }
    closeMentions() {
      if (this.mentionPop) this.mentionPop.remove();
      this.mentionPop = null;
      this.mentionSel = 0;
    }
    pickMention(i) {
      const mem = this.mentionList[i];
      const pos = this.input.selectionStart;
      const before = this.input.value.slice(0, pos - this.mentionQuery.length - 1);
      const after = this.input.value.slice(pos);
      const ins = '@' + mem.name.replace(/\s+/g, '') + ' ';
      this.input.value = before + ins + after;
      const c = before.length + ins.length;
      this.input.setSelectionRange(c, c);
      this.closeMentions();
      this.onInput(true);
    }
    insertText(t) {
      const el = this.input;
      const s = el.selectionStart ?? el.value.length;
      const e = el.selectionEnd ?? el.value.length;
      el.value = el.value.slice(0, s) + t + el.value.slice(e);
      el.setSelectionRange(s + t.length, s + t.length);
      el.focus();
      this.onInput(true);
    }
    onKey(e) {
      if (this.mentionPop) {
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault();
          const n = this.mentionList.length;
          this.mentionSel = (this.mentionSel + (e.key === 'ArrowDown' ? 1 : n - 1)) % n;
          this.updateMentions();
          return;
        }
        if (e.key === 'Enter' || e.key === 'Tab') {
          e.preventDefault();
          this.pickMention(this.mentionSel);
          return;
        }
        if (e.key === 'Escape') {
          e.preventDefault();
          this.closeMentions();
          return;
        }
      }
      const enterSend = this.app.settings.enterSend;
      if (e.key === 'Enter' && !e.isComposing && ((enterSend && !e.shiftKey) || (!enterSend && (e.ctrlKey || e.metaKey)))) {
        e.preventDefault();
        this.submit();
      } else if (e.key === 'Escape' && (this.reply || this.editing)) {
        e.preventDefault();
        this.cancelCtx();
      } else if (e.key === 'ArrowUp' && !this.input.value && this.room) {
        const mine = [...this.room.messages].reverse().find((m) => m.a === this.app.myId && !m.deleted);
        if (mine) {
          e.preventDefault();
          this.startEdit(mine);
        }
      }
    }
    async submit() {
      const room = this.room;
      if (!room) return;
      const text = this.input.value;
      if (!D.events.hasVisibleText(text)) return;
      if (text.length > D.events.MAX_TEXT) {
        toast('Messages can be up to ' + D.events.MAX_TEXT + ' characters. This one has ' + text.length + '.', { type: 'err' });
        return;
      }
      try {
        if (this.editing) {
          await this.app.editMessage(room, this.editing, text);
          this.editing = null;
          this.input.value = this.drafts.get(room.id) || '';
        } else {
          const reply = this.reply;
          this.reply = null;
          this.input.value = '';
          this.drafts.delete(room.id);
          await this.app.sendMessage(room, text, reply);
        }
      } catch (err) {
        toast(err.message, { type: 'err' });
      }
      this.renderCtx();
      this.onInput(true);
      this.closeMentions();
      this.scrollToBottom(false);
    }
  }

  UI.Shell = Shell;
})();

/* ---- ui/dialogs.js ---- */
/* Dyad UI: dialogs. */
(() => {
  'use strict';
  const D = globalThis.Dyad;
  const UI = D.ui;
  const { h, add, clear, icon, avatar, toast, dialog, confirmDialog, copyText, downloadFile, switchEl } = UI;
  const app = () => D.appInstance;

  function busy(btn, label) {
    const prev = [...btn.childNodes];
    btn.disabled = true;
    add(clear(btn), h('span', label));
    return () => {
      btn.disabled = false;
      add(clear(btn), ...prev);
    };
  }
  function pwField(placeholder = 'Optional', id) {
    const input = h('input.input', { type: 'password', placeholder, autocomplete: 'new-password', id, spellcheck: 'false' });
    const btn = h('button.icon-btn.sm', { type: 'button', 'aria-label': 'Show password', onclick: () => {
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      clear(btn).appendChild(icon(show ? 'eyeOff' : 'eye', 'sm'));
    } }, icon('eye', 'sm'));
    return { input, el: h('div.input-wrap', input, btn) };
  }
  const canScan = () => typeof globalThis.BarcodeDetector === 'function' && navigator.mediaDevices && navigator.mediaDevices.getUserMedia;

  /* ---------------- Create / join ---------------- */
  function roomDialog(mode = 'create', prefill = {}) {
    let tab = mode;
    const body = h('div');
    const footer = h('div.row', { style: { width: '100%', justifyContent: 'flex-end' } });
    const tabs = h('div.seg', { role: 'tablist', style: { marginBottom: '16px' } });
    const d = dialog({ title: 'Rooms', body: [tabs, body], footer, cls: '' });
    const render = () => {
      clear(tabs);
      [['create', 'Create'], ['join', 'Join with code'], ['invite', 'Invite code']].forEach(([k, l]) => tabs.appendChild(h('button' + (tab === k ? '.on' : ''), { role: 'tab', 'aria-selected': String(tab === k), onclick: () => { tab = k; render(); } }, l)));
      clear(body);
      clear(footer);
      if (tab === 'create') createTab();
      else if (tab === 'join') joinTab();
      else inviteTab();
      const f = body.querySelector('[autofocus]');
      if (f) f.focus();
    };
    const createTab = () => {
      const name = h('input.input', { placeholder: 'e.g. Study group', maxlength: '60', autofocus: true });
      const code = h('input.input.mono', { value: D.words.roomCode(), spellcheck: 'false', autocomplete: 'off' });
      const strength = h('div.hint');
      const pw = pwField('Optional extra secret');
      const check = () => {

  /* ---------------- QR scanning ---------------- */
  function scanQr() {
    return new Promise((resolve) => {
      let stream = null;
      let timer = null;
      let done = false;
      const video = h('video', { playsinline: true, muted: true, autoplay: true });
      const msg = h('div.hint', 'Point the camera at the QR code.');
      const d = dialog({
        title: 'Scan QR code',
        body: [h('div.video-wrap', video), msg],
        onClose: () => {
          clearInterval(timer);
          if (stream) stream.getTracks().forEach((t) => t.stop());
          if (!done) resolve(null);
        },
      });
      (async () => {
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
          video.srcObject = stream;
          await video.play();
          const det = new BarcodeDetector({ formats: ['qr_code'] });
          timer = setInterval(async () => {
            try {
              const codes = await det.detect(video);
              const hit = codes.find((c) => /DYAD1\./.test(c.rawValue));
              if (hit) {
                done = true;
                resolve(hit.rawValue);
                d.close();
              }
            } catch {}
          }, 250);
        } catch (e) {
          msg.className = 'hint err';
          msg.textContent = 'Camera unavailable: ' + (e.message || 'permission denied') + '. Paste the code instead.';
        }
      })();
    });
  }

  /* ---------------- Quick switcher & search ---------------- */
  function quickSwitcher(scopeRoom) {
    const a = app();
    const input = h('input.input', { placeholder: scopeRoom ? 'Search in #' + a.roomTitle(scopeRoom) + '…' : 'Jump to a room or search messages…', 'aria-label': 'Search', autofocus: true });
    const results = h('div.results.scroll', { role: 'listbox' });
    const box = h('div.dialog.quick', { role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Search' }, input, results);
    const overlay = h('div.overlay', box);
    document.body.appendChild(overlay);
    const prev = document.activeElement;
    const close = () => {
      overlay.remove();
      if (prev && prev.focus) prev.focus();
    };
    overlay.addEventListener('mousedown', (e) => e.target === overlay && close());
    let sel = 0;
    let items = [];
    const highlight = (text, q) => {
      const span = h('span');
      const i = q ? text.toLowerCase().indexOf(q) : -1;
      if (i < 0) span.textContent = text;
      else add(span, text.slice(0, i), h('mark', text.slice(i, i + q.length)), text.slice(i + q.length));
      return span;
    };
    const render = () => {
      const q = input.value.trim().toLowerCase();
      items = [];
      const rooms = [...a.rooms.values()];
      if (!scopeRoom) {
        for (const r of rooms) {
          const t = a.roomTitle(r);
          if (!q || t.toLowerCase().includes(q)) items.push({ kind: 'room', room: r, title: t });
        }
        items.sort((x, y) => y.room.lastActivity - x.room.lastActivity);
        items = items.slice(0, 8);
      }
      if (q.length >= 2) {
        const pool = scopeRoom ? [scopeRoom] : rooms;
        const hits = [];
        for (const r of pool) for (const m of r.messages) if (!m.deleted && m.text.toLowerCase().includes(q)) hits.push({ kind: 'msg', room: r, m });
        hits.sort((x, y) => y.m.ts - x.m.ts);
        items.push(...hits.slice(0, 40));
      }
      sel = Math.min(sel, Math.max(0, items.length - 1));
      clear(results);
      if (!items.length) results.appendChild(h('div.side-empty', q ? 'No results for "' + input.value + '"' : scopeRoom ? 'Type to search messages.' : 'No rooms yet.'));
      items.forEach((it, i) => {
        const row =
          it.kind === 'room'
            ? h('button.res' + (i === sel ? '.on' : ''), { role: 'option' }, it.room.kind === 'dm' ? avatar(a.profileOf(it.room.peer.id), 'sm') : h('span.room-ico', icon('hash', 'sm')), h('div.meta', h('div', highlight(it.title, q)), h('div.sub', it.room.kind === 'dm' ? 'Direct message' : it.room.unread ? it.room.unread + ' unread' : 'Room')))
            : h('button.res' + (i === sel ? '.on' : ''), { role: 'option' }, avatar(it.m.a === a.myId ? a.me : a.profileOf(it.m.a), 'sm'), h('div.meta', h('div', h('b', a.nameOf(it.m.a)), h('span.muted', ' in ' + a.roomTitle(it.room) + ' · ' + UI.shortWhen(it.m.ts))), h('div.sub', highlight(D.markdown.plain(it.m.text, 140), q))));
        row.addEventListener('click', () => choose(i));
        row.addEventListener('mousemove', () => {
          if (sel !== i) {
            sel = i;
            render();
          }
        });
        results.appendChild(row);
      });
    };
    const choose = (i) => {
      const it = items[i];
      if (!it) return;
      close();
      a.setActive(it.room.id);
      if (it.kind === 'msg') setTimeout(() => D.shell.jumpTo(it.m.id), 80);
    };
    input.addEventListener('input', () => {
      sel = 0;
      render();
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        sel = Math.min(items.length - 1, sel + 1);
        render();
        results.querySelector('.on')?.scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        sel = Math.max(0, sel - 1);
        render();
        results.querySelector('.on')?.scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter') {
        e.preventDefault();
        choose(sel);
      } else if (e.key === 'Escape') {
        e.preventDefault();
        e.stopPropagation();
        close();
      }
    });
    render();
    requestAnimationFrame(() => input.focus());
  }

  function onNotify(app, room, m) {
    const mode = app.notifyMode(room);
    const mentioned = m.m.includes(app.myId);
    if (mode === 'none' || (mode === 'mentions' && !mentioned)) return;
    if (app.settings.sound) chime();
    if (app.settings.notifications && typeof Notification !== 'undefined' && Notification.permission === 'granted' && document.hidden) {
      try {
        const n = new Notification(room.kind === 'dm' ? app.nameOf(m.a) : app.nameOf(m.a) + ' in #' + room.displayName, { body: D.markdown.plain(m.text, 140), tag: room.id, silent: true });
        n.onclick = () => {
          window.focus();
          app.setActive(room.id);
          n.close();
        };
      } catch {}
    }
  }

  /* ---------------- keyboard ---------------- */
  function keyboard(app) {
    document.addEventListener('keydown', (e) => {
      const mod = e.ctrlKey || e.metaKey;
      if (UI.anyDialogOpen() && !(mod && e.key.toLowerCase() === 'k')) return;
      const k = e.key.toLowerCase();
      if (mod && k === 'k') {
        e.preventDefault();
        UI.closeAllDialogs();
        UI.dialogs.quickSwitcher();
      } else if (mod && k === 'f' && app.activeRoomId) {
        e.preventDefault();
        UI.dialogs.quickSwitcher(app.rooms.get(app.activeRoomId));
      } else if (mod && k === 'n') {
        e.preventDefault();
        UI.dialogs.roomDialog('create');
      } else if (mod && k === 'j') {
        e.preventDefault();
        UI.dialogs.roomDialog('join');
      } else if (mod && k === '/') {
        e.preventDefault();
        UI.dialogs.shortcuts();
      } else if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
        e.preventDefault();
        const items = [...document.querySelectorAll('.side-item')];
        const i = items.findIndex((x) => x.classList.contains('active'));
        const n = items[e.key === 'ArrowDown' ? Math.min(items.length - 1, i + 1) : Math.max(0, i - 1)];
        if (n) n.click();
      } else if (e.key === 'Escape' && document.querySelector('.shell.nav-open')) {
        document.querySelector('.shell').classList.remove('nav-open');
      } else if (e.key === 'Escape' && !e.defaultPrevented && D.shell && D.shell.detailsOpen && (innerWidth <= 1100 || document.activeElement !== D.shell.input)) {
        D.shell.toggleDetails();
      } else if (!mod && !e.altKey && e.key.length === 1 && D.shell && D.shell.input && document.activeElement === document.body && app.activeRoomId) {
        D.shell.input.focus();
      }
    });
  }

  /* ---------------- boot ---------------- */
  function testOptions() {
    const m = /dyad-test(?:&|$)(.*)$/.exec(location.hash);
    if (!m) return null;
    const q = new URLSearchParams(m[1]);
    const relays = (q.get('relays') || '').split(',').filter((r) => /^(?:(?:tracker|nostr|mqtt)\+)?wss?:\/\/(localhost|127\.0\.0\.1)(:\d+)?(\/|$)/.test(r));
    return { relays: relays.length ? relays : null, nostun: q.get('nostun') === '1', db: q.get('db') || undefined };
  }

  async function boot() {
    const app = new D.App();
    D.appInstance = app;
    D.applyTheme();
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => D.applyTheme());
    const test = testOptions();
    if (test) {
      window.__dyad = D;
      D.debug = true;
    }
    if (!window.isSecureContext || !crypto.subtle || typeof RTCPeerConnection === 'undefined') {
      return messageScreen('This browser is not supported', 'Dyad needs a modern browser with WebCrypto and WebRTC, like current Chrome, Edge or Firefox.');
    }
    const tab = await claimTab();
    if (!tab.ok) {
      return messageScreen('Dyad is open in another tab', 'Use one tab at a time so messages are not missed.', 'Use Dyad here', () => {
        tab.bc && tab.bc.postMessage({ t: 'takeover', from: tab.me });
        setTimeout(() => location.reload(), 300);
      });
    }
    let state;
    try {
      state = await app.boot(test);
    } catch (e) {
      D.log.error('boot failed', e);
      return messageScreen('Dyad could not start', (e && e.message) || 'Local storage is unavailable. If your device is managed, storage may be disabled for files.');
    }
    if (state === 'locked') {
      await lockScreen(app);
      state = app.identity && app.me ? 'ready' : 'onboarding';
    }
    D.applyTheme();
    if (state === 'onboarding') await onboarding(app);
    watchTab(tab.bc, tab.me, () => {
      app.stopNetwork();
      messageScreen('Dyad opened in another tab', 'This tab is paused so only one copy is connected.', 'Use Dyad here', () => location.reload());
    });
    D.shell = new UI.Shell(app, root());
    if (!app.rooms.size) setTimeout(() => { const b = document.querySelector('.welcome .btn.primary'); if (b) b.focus(); }, 50);
    app.startNetwork();
    D.shell.renderMe();
    app.on('notify', (room, m) => onNotify(app, room, m));
    app.on('change', () => updateAttention(app));
    keyboard(app);
    let awayTimer = null;
    let away = false;
    document.addEventListener('visibilitychange', () => {
      clearTimeout(awayTimer);
      if (document.hidden) awayTimer = setTimeout(() => { away = true; app.setAway(true); }, 5 * 60 * 1000);
      else {
        if (away) app.setAway(false);
        away = false;
        const r = app.rooms.get(app.activeRoomId);
        if (r && D.shell.atBottom()) app.markRead(r);
      }
    });
    window.addEventListener('focus', () => {
      app.focused = true;
      const r = app.rooms.get(app.activeRoomId);
      if (r && D.shell.atBottom()) app.markRead(r);
    });
    window.addEventListener('blur', () => (app.focused = false));
    window.addEventListener('pagehide', () => {
      app.store.flush();
      if (app.net) for (const s of app.net.swarms.values()) for (const p of s.openPeers()) p.send({ t: 'bye' });
    });
    D.emitGlobal = (ev, err) => {
      if (ev === 'saveError') toast('Could not save to this device: ' + ((err && err.message) || 'storage error'), { type: 'err' });
    };
    const first = [...app.rooms.values()].sort((a, b) => b.lastActivity - a.lastActivity)[0];
    let last = null;
    try {
      last = localStorage.getItem('dyad.lastRoom');
    } catch {}
    const startRoom = (last && app.rooms.get(last)) || first;
    if (startRoom && innerWidth > 760) app.setActive(startRoom.id);
    app.on('change', (s) => {
      if (s.has('room')) {
        try {
          localStorage.setItem('dyad.lastRoom', app.activeRoomId || '');
        } catch {}
      }
    });
    if (app.store.readOnly) toast('This data was saved by a newer version of Dyad. Changes will not be saved.', { type: 'err', ms: 10000 });
  }

  D.boot = boot;
  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  }
})();
</script>
</body>
</html>
