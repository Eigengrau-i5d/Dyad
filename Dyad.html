<style>
/* ===== Dyad design tokens ===== */
:root {
  --font: 'Inter', 'Roboto', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --mono: 'Roboto Mono', 'Cascadia Code', 'Consolas', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --accent: #5b5bd6;
  --accent-hover: #4c4cc4;
  --accent-soft: rgba(91, 91, 214, 0.12);
  --accent-text: #ffffff;
  --accent-fg: var(--accent);
  --bg: #ffffff;
  --bg-elev: #ffffff;
  --bg-sunken: #f5f6f8;
  --sidebar: #f3f4f7;
  --sidebar-hover: #e8eaef;
  --sidebar-active: #e2e4f6;
  --border: #e4e6eb;
  --border-strong: #d2d5dc;
  --text: #16181d;
  --text-2: #4b5160;
  --text-3: #626877;
  --text-on-sidebar: #1b1d22;
  --hover: rgba(15, 23, 42, 0.04);
  --msg-hover: #f7f8fa;
  --mention-bg: rgba(234, 179, 8, 0.12);
  --mention-border: #eab308;
  --code-bg: #f1f2f5;
  --success: #16a34a;
  --warning: #d97706;
  --danger: #dc2626;
  --danger-soft: rgba(220, 38, 38, 0.1);
  --online: #22c55e;
  --away: #f59e0b;
  --offline: #9ca3af;
  --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.06);
  --shadow: 0 4px 12px rgba(16, 24, 40, 0.08), 0 1px 3px rgba(16, 24, 40, 0.06);
  --shadow-lg: 0 20px 48px rgba(16, 24, 40, 0.18), 0 4px 12px rgba(16, 24, 40, 0.08);
  --radius: 10px;
  --radius-sm: 6px;
  --radius-lg: 16px;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --dur: 160ms;
  --overlay: rgba(10, 12, 18, 0.45);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) .msg .author { color: color-mix(in srgb, var(--c, #fff) 55%, #ffffff); }
  :root:not([data-theme='light']) {
    --bg: #15171c;
    --bg-elev: #1d2027;
    --bg-sunken: #111317;
    --sidebar: #101216;
    --sidebar-hover: #1a1d23;
    --sidebar-active: #252840;
    --border: #262a32;
    --border-strong: #343944;
    --text: #e8eaef;
    --text-2: #b4b9c4;
    --text-3: #8b91a0;
    --text-on-sidebar: #e3e5ea;
    --hover: rgba(255, 255, 255, 0.05);
    --msg-hover: #1a1d23;
    --code-bg: #23262e;
    --mention-bg: rgba(234, 179, 8, 0.1);
    --accent-soft: rgba(129, 129, 255, 0.16);
    --accent-fg: color-mix(in srgb, var(--accent) 55%, #ffffff);
    --danger-soft: rgba(248, 113, 113, 0.12);
    --shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    --shadow-lg: 0 24px 56px rgba(0, 0, 0, 0.55);
    --overlay: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme='dark'] .msg .author { color: color-mix(in srgb, var(--c, #fff) 55%, #ffffff); }
:root[data-theme='dark'] {
  --bg: #15171c;
  --bg-elev: #1d2027;
  --bg-sunken: #111317;
  --sidebar: #101216;
  --sidebar-hover: #1a1d23;
  --sidebar-active: #252840;
  --border: #262a32;
  --border-strong: #343944;
  --text: #e8eaef;
  --text-2: #b4b9c4;
  --text-3: #8b91a0;
  --text-on-sidebar: #e3e5ea;
  --hover: rgba(255, 255, 255, 0.05);
  --msg-hover: #1a1d23;
  --code-bg: #23262e;
  --mention-bg: rgba(234, 179, 8, 0.1);
  --accent-soft: rgba(129, 129, 255, 0.16);
  --accent-fg: color-mix(in srgb, var(--accent) 55%, #ffffff);
  --danger-soft: rgba(248, 113, 113, 0.12);
  --shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 24px 56px rgba(0, 0, 0, 0.55);
  --overlay: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

/* ===== Base ===== */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font);
  font-size: 14.5px;
  line-height: 1.45;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  text-rendering: optimizeLegibility;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: var(--accent-fg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--accent-soft); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 15px; height: 15px; }
svg.i.lg { width: 22px; height: 22px; }
.scroll { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
.scroll::-webkit-scrollbar { width: 10px; }
.scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
.hidden { display: none !important; }
.muted { color: var(--text-3); }
.grow { flex: 1; min-width: 0; }
.row { display: flex; align-items: center; gap: 8px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
kbd { font-family: var(--mono); font-size: 11.5px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--border-strong); border-bottom-width: 2px; background: var(--bg-elev); color: var(--text-2); }

/* ===== Buttons & inputs ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 38px; padding: 0 16px; border-radius: var(--radius-sm);
  font-weight: 600; font-size: 14px; white-space: nowrap;
  border: 1px solid var(--border-strong); background: var(--bg-elev); color: var(--text);
  transition: background var(--dur) var(--ease), border-color var(--dur), transform 80ms, box-shadow var(--dur);
}
.btn:hover { background: var(--hover); border-color: var(--text-3); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.danger:hover { filter: brightness(0.94); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--hover); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }
.btn.lg { height: 46px; padding: 0 22px; font-size: 15px; border-radius: var(--radius); }
.btn.block { width: 100%; }
.icon-btn {
  display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; color: var(--text-2);
  transition: background var(--dur), color var(--dur);
}
.icon-btn:hover { background: var(--hover); color: var(--text); }
.icon-btn.active { color: var(--accent-fg); background: var(--accent-soft); }
.icon-btn.sm { width: 28px; height: 28px; border-radius: 6px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .label { font-size: 12.5px; font-weight: 600; color: var(--text-2); letter-spacing: 0.01em; }
.hint { font-size: 12.5px; color: var(--text-3); }
.hint.warn { color: var(--warning); }
.hint.err { color: var(--danger); }
.input, textarea.input, select.input {
  width: 100%; height: 40px; padding: 0 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong); background: var(--bg); color: var(--text);
  transition: border-color var(--dur), box-shadow var(--dur);
}
textarea.input { height: auto; padding: 10px 12px; resize: vertical; line-height: 1.45; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input.mono { font-family: var(--mono); font-size: 13px; }
.input-wrap { position: relative; display: flex; align-items: center; }
.input-wrap .input { padding-right: 42px; }
.input-wrap .icon-btn { position: absolute; right: 4px; }
.switch { position: relative; width: 38px; height: 22px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 22px; background: var(--border-strong); transition: background var(--dur); pointer-events: none; }
.switch span::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: var(--shadow-sm); transition: transform var(--dur) var(--ease); }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(16px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--bg-sunken); border: 1px solid var(--border); border-radius: 9px; }
.seg button { padding: 6px 12px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--text-2); }
.seg button.on { background: var(--bg-elev); color: var(--text); box-shadow: var(--shadow-sm); }

/* ===== Avatars & badges ===== */
.avatar {
  --size: 36px; width: var(--size); height: var(--size); border-radius: 50%; flex: none;
  display: grid; place-items: center; color: #fff; font-weight: 700; font-size: calc(var(--size) * 0.4);
  position: relative; user-select: none; letter-spacing: -0.02em;
}
.avatar.emoji { font-size: calc(var(--size) * 0.55); }
.avatar.sm { --size: 26px; }
.avatar.xs { --size: 18px; font-size: 9px; }
.avatar.lg { --size: 64px; }
.avatar .dot { position: absolute; right: -1px; bottom: -1px; width: 30%; height: 30%; min-width: 9px; min-height: 9px; border-radius: 50%; border: 2px solid var(--bg); background: var(--offline); }
.avatar .dot.online { background: var(--online); }
.avatar .dot.away { background: var(--away); }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--accent); color: #fff; font-size: 11.5px; font-weight: 700; display: inline-grid; place-items: center; }
.badge.mention { background: var(--danger); }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 12px; font-size: 12px; font-weight: 600; background: var(--bg-sunken); color: var(--text-2); border: 1px solid var(--border); white-space: nowrap; }
.pill .led { width: 7px; height: 7px; border-radius: 50%; background: var(--offline); }
.pill.ok .led { background: var(--online); box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18); }
.pill.wait .led { background: var(--away); animation: pulse 1.4s infinite; }
.pill.bad .led { background: var(--danger); }
@keyframes pulse { 50% { opacity: 0.35; } }
.tag { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent-fg); text-transform: uppercase; letter-spacing: 0.04em; }
.tag.ok { background: rgba(22, 163, 74, 0.12); color: var(--success); }

/* ===== App layout ===== */
#app { height: 100%; }
.shell { display: grid; grid-template-columns: 272px minmax(0, 1fr) auto; height: 100%; }
.sidebar { background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; color: var(--text-on-sidebar); }
.brand { display: flex; align-items: center; gap: 10px; padding: 16px 16px 10px; }
.brand .logo { width: 30px; height: 30px; }
.brand b { font-size: 18px; letter-spacing: -0.02em; }
.brand .grow { display: flex; align-items: center; gap: 8px; }
.side-search { margin: 4px 12px 8px; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border-radius: 8px; background: var(--bg-elev); border: 1px solid var(--border); color: var(--text-3); font-size: 13.5px; text-align: left; width: calc(100% - 24px); }
.side-search:hover { border-color: var(--border-strong); }
.side-search kbd { margin-left: auto; }
.side-list { flex: 1; min-height: 0; padding: 4px 8px 12px; }
.side-section { display: flex; align-items: center; justify-content: space-between; padding: 14px 8px 4px; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); }
.side-item {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 8px; border-radius: 8px; text-align: left;
  color: var(--text-on-sidebar); transition: background var(--dur);
}
.side-item:hover { background: var(--sidebar-hover); }
.side-item.active { background: var(--sidebar-active); }
.side-item .room-ico { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--bg-elev); border: 1px solid var(--border); color: var(--text-2); font-weight: 700; flex: none; }
.side-item .meta { flex: 1; min-width: 0; }
.side-item .name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.side-item .sub { font-size: 12.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side-item.unread .name { font-weight: 800; }
.side-item.unread .sub { color: var(--text-2); }
.side-item .muted-ico { color: var(--text-3); }
.side-empty { padding: 10px 10px; font-size: 13px; color: var(--text-3); }
.me-card { border-top: 1px solid var(--border); padding: 10px 12px; display: flex; align-items: center; gap: 10px; }
.me-card .meta { flex: 1; min-width: 0; }
.me-card .name { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.me-card .sub { font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 5px; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); position: relative; }
.topbar { height: 60px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 20px; border-bottom: 1px solid var(--border); background: var(--bg); }
.topbar .title { min-width: 0; flex: 1; display: flex; flex-direction: column; justify-content: center; }
.topbar h1 { margin: 0; font-size: 16px; font-weight: 750; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 8px; }
.topbar .subtitle { font-size: 12.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.topbar .actions { display: flex; align-items: center; gap: 2px; }
.nav-btn { display: none; }
.scrim { display: none; }
.art { display: block; width: 84px; height: 84px; margin: 0 auto 16px; filter: drop-shadow(0 10px 24px rgba(91, 91, 214, 0.25)); }

.banner { display: flex; align-items: flex-start; gap: 12px; margin: 12px 20px 0; padding: 12px 14px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg-sunken); font-size: 13.5px; }
.banner.warn { border-color: rgba(217, 119, 6, 0.35); background: rgba(217, 119, 6, 0.08); }
.banner.err { border-color: rgba(220, 38, 38, 0.35); background: var(--danger-soft); }
.banner .grow b { display: block; margin-bottom: 2px; }
.banner .acts { display: flex; gap: 6px; flex-wrap: wrap; }

/* ===== Messages ===== */
.messages { flex: 1; min-height: 0; position: relative; }
.msg-scroll { position: absolute; inset: 0; padding: 12px 0 8px; }
.msg-list { display: flex; flex-direction: column; min-height: 100%; justify-content: flex-end; }
.day { display: flex; align-items: center; gap: 12px; margin: 18px 20px 6px; font-size: 12px; font-weight: 700; color: var(--text-3); }
.day::before, .day::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.new-line { display: flex; align-items: center; gap: 10px; margin: 6px 20px; color: var(--danger); font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; }
.new-line::after { content: ''; flex: 1; height: 1px; background: var(--danger); opacity: 0.5; }
.msg { position: relative; display: grid; grid-template-columns: 40px minmax(0, 1fr); column-gap: 12px; padding: 3px 20px; transition: background 120ms; }
.msg.first { padding-top: 10px; }
.msg:hover, .msg.menu-open { background: var(--msg-hover); }
.msg.mentioned { background: var(--mention-bg); box-shadow: inset 3px 0 0 var(--mention-border); }
.msg.flash { animation: flash 1.6s var(--ease); }
@keyframes flash { 0%, 30% { background: var(--accent-soft); } }
.msg .gutter { padding-top: 2px; }
.msg .gutter time { display: none; font-size: 10.5px; color: var(--text-3); text-align: right; padding-top: 3px; white-space: nowrap; }
.msg:not(.first):hover .gutter time { display: block; }
.msg .head { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.msg .author { unicode-bidi: isolate; color: var(--c, var(--text)); font-weight: 700; font-size: 14.5px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msg .author:hover { text-decoration: underline; }
.msg .head time { font-size: 12px; color: var(--text-3); white-space: nowrap; }
.msg .body { overflow-wrap: anywhere; white-space: pre-wrap; color: var(--text); }
.msg .body.big { font-size: 36px; line-height: 1.2; }
.msg .body.deleted { color: var(--text-3); font-style: italic; }
.msg .edited { font-size: 11.5px; color: var(--text-3); margin-left: 4px; }
.msg .body code { font-family: var(--mono); font-size: 0.88em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; border: 1px solid var(--border); }
.msg .body pre { font-family: var(--mono); font-size: 13px; background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin: 4px 0; overflow-x: auto; white-space: pre; }
.msg .body blockquote { margin: 2px 0; padding: 0 0 0 10px; border-left: 3px solid var(--border-strong); color: var(--text-2); }
.msg .body a { color: var(--accent-fg); text-decoration: none; }
.msg .body a:hover { text-decoration: underline; }
.mention-chip { background: var(--accent-soft); color: var(--accent-fg); border-radius: 4px; padding: 0 3px; font-weight: 600; }
.mention-chip.me { background: rgba(234, 179, 8, 0.25); color: inherit; }
.reply-ref { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-3); margin: 0 0 2px; cursor: pointer; min-width: 0; }
.reply-ref::before { content: ''; width: 18px; height: 10px; border-left: 2px solid var(--border-strong); border-top: 2px solid var(--border-strong); border-top-left-radius: 6px; margin-top: 6px; flex: none; }
.reply-ref b { color: var(--text-2); font-weight: 650; white-space: nowrap; }
.reply-ref span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.reply-ref:hover span { color: var(--text); }
.reactions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.react { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg-sunken); font-size: 13px; transition: border-color var(--dur), background var(--dur); }
.react:hover { border-color: var(--border-strong); }
.react.mine { border-color: var(--accent); background: var(--accent-soft); }
.react b { font-size: 12px; font-weight: 700; color: var(--text-2); }
.react.add { color: var(--text-3); padding: 0 6px; opacity: 0; }

.send-btn { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; background: var(--accent); color: #fff; transition: opacity var(--dur), background var(--dur); }

.mention-pop { position: absolute; left: 20px; right: 20px; bottom: calc(100% - 8px); max-width: 360px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-lg); padding: 4px; z-index: 10; }
.mention-pop button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border-radius: 6px; text-align: left; }
.mention-pop button.on, .mention-pop button:hover { background: var(--accent-soft); }

/* ===== Details panel ===== */
.details { width: 300px; border-left: 1px solid var(--border); background: var(--bg); display: flex; flex-direction: column; min-height: 0; }

.tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
.panel-body { flex: 1; min-height: 0; padding: 12px; }
.member { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 8px; border-radius: 8px; text-align: left; }
.member:hover { background: var(--hover); }
.member .meta { flex: 1; min-width: 0; }
.member .name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.kv .k { font-size: 12px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.05em; }

@keyframes rise { from { opacity: 0; transform: translateY(8px) scale(0.985); } }

.dialog .content { padding: 8px 22px 18px; overflow-y: auto; }

.setting .grow b { display: block; font-weight: 600; font-size: 14px; }

.swatches { display: flex; gap: 8px; flex-wrap: wrap; }

.qr { width: 220px; height: 220px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); background: #fff; margin: 0 auto; }

.code-area { font-family: var(--mono); font-size: 11.5px; word-break: break-all; height: 96px; }
.steps { counter-reset: s; display: flex; flex-direction: column; gap: 14px; }
.step { display: grid; grid-template-columns: 28px 1fr; gap: 10px; }
.step::before { counter-increment: s; content: counter(s); width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-fg); font-weight: 800; display: grid; place-items: center; font-size: 13px; }
.safety { text-align: center; padding: 8px 0 4px; }
.safety .em { font-size: 34px; letter-spacing: 6px; }
.safety .dg { font-family: var(--mono); font-size: 20px; font-weight: 700; letter-spacing: 3px; margin-top: 6px; }
.video-wrap { position: relative; border-radius: 12px; overflow: hidden; background: #000; aspect-ratio: 4 / 3; }

.popover { position: fixed; z-index: 120; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-lg); padding: 5px; min-width: 190px; animation: rise 140ms var(--ease); }

.menu-sep { height: 1px; background: var(--border); margin: 4px 2px; }

    off(ev, fn) {
      const s = this._h.get(ev);
      if (s) s.delete(fn);
    }
    emit(ev, ...args) {
      const s = this._h.get(ev);
      if (!s) return;
      for (const fn of [...s]) {
        try {
          fn(...args);
        } catch (e) {
          D.log && D.log.error('listener error', ev, e);
        }
      }
    }
  }

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  /** Small LRU set for de-duplication. */
  class SeenSet {
    constructor(max = 20000) {
      this.max = max;
      this.map = new Map();
    }
    has(k) {
      return this.map.has(k);
    }
    add(k) {
      if (this.map.has(k)) return false;
      this.map.set(k, 1);
      if (this.map.size > this.max) {
        const first = this.map.keys().next().value;
        this.map.delete(first);
      }
      return true;
    }
  }

  /** Token bucket rate limiter. */
  class RateLimiter {
    constructor(perSec, burst) {
      this.rate = perSec;
      this.burst = burst;
      this.tokens = burst;
      this.last = Date.now();
    }
    take(n = 1) {
      const now = Date.now();
      this.tokens = Math.min(this.burst, this.tokens + ((now - this.last) / 1000) * this.rate);
      this.last = now;
      if (this.tokens < n) return false;
      this.tokens -= n;
      return true;
    }
  }

  /** In-memory ring log; never logs message contents or secrets. */
  const LOG_MAX = 400;
  const logLines = [];
  function logAt(level, args) {
    const line =
      new Date().toISOString() +
      ' ' +
      level.toUpperCase() +
      ' ' +
      args
        .map((a) => {
          if (a instanceof Error) return a.name + ': ' + a.message;
          if (typeof a === 'object') {
            try {
              return JSON.stringify(a).slice(0, 300);
            } catch {
              return String(a);
            }
          }
          return String(a);
        })
        .join(' ');
    logLines.push(line);
    if (logLines.length > LOG_MAX) logLines.shift();
    if (D.debug || level === 'error') {
      (console[level] || console.log)('[dyad]', ...args);
    }
  }
  const log = {
    info: (...a) => logAt('info', a),
    warn: (...a) => logAt('warn', a),
    error: (...a) => logAt('error', a),
    lines: () => logLines.slice(),
  };

  Object.assign(D, {
    VERSION: '1.0.0',
    APP_ID: 'dyad.chat',
    b64u,
    unb64u,
    hex,
    unhex,
    utf8,
    fromUtf8,
    concatBytes,
    randomBytes,
    randomId,
    canonical,
    sha256,
    sha1hex,
    Emitter,
    sleep,
    clamp,
    SeenSet,
    RateLimiter,
    log,
  });
})();

/* ---- core/crypto.js ---- */
/* Dyad core: cryptography (WebCrypto only). */
(() => {
  'use strict';
  const D = globalThis.Dyad;
  const { b64u, unb64u, utf8, fromUtf8, hex, canonical, sha256, concatBytes, randomBytes } = D;
  const subtle = crypto.subtle;

  const ROOM_KDF_ITER = 310000;
  const LOCK_KDF_ITER = 600000;

  function normalizeCode(code) {
    return String(code || '')
      .trim()
      .toLowerCase()
      .replace(/\s+/g, '-')
      .replace(/[^a-z0-9-]/g, '')
      .replace(/-+/g, '-')
      .replace(/^-|-$/g, '');
  }

  async function pbkdf2Key(secret, salt, iterations, usages = ['encrypt', 'decrypt']) {
    const base = await subtle.importKey('raw', utf8(secret), 'PBKDF2', false, ['deriveKey']);
    return subtle.deriveKey(
      { name: 'PBKDF2', hash: 'SHA-256', salt: typeof salt === 'string' ? utf8(salt) : salt, iterations },
      base,
      { name: 'AES-GCM', length: 256 },
      false,
      usages
    );
  }

  /**
   * Room secrets. topic is public (hashed, sent to relays); key never leaves the device.
   * Password is optional and only changes the key, so a wrong password is detectable.
   */
  async function pbkdf2Bits(secret, salt, iterations) {
    const base = await subtle.importKey('raw', utf8(secret), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(
      await subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: utf8(salt), iterations }, base, 256)
    );
  }
  const importAes = (raw) => subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);

  /**
   * Both the topic and the key use slow PBKDF2, so someone watching public relays
   * cannot cheaply guess room codes from the topics they see.
   * Returns keyRaw (b64u) so it can be cached in local storage (encrypted when locked).
   */
  async function deriveRoom(code, password = '') {
    const c = normalizeCode(code);
    if (c.length < 4) throw new Error('Room code is too short');
    const topic = hex(await pbkdf2Bits(c, 'dyad/v1/topic', ROOM_KDF_ITER));
    const raw = await pbkdf2Bits(c + '|' + (password || ''), 'dyad/v1/key|' + topic, ROOM_KDF_ITER);
    return { code: c, topic, roomId: 'r' + topic.slice(0, 31), keyRaw: b64u(raw), key: await importAes(raw) };
  }
  async function roomFromCache(topic, keyRaw, prefix = 'r') {
    return { topic, roomId: prefix + topic.slice(0, 31), keyRaw, key: await importAes(unb64u(keyRaw)) };
  }

  async function seal(key, obj) {
    const iv = randomBytes(12);
    const pt = typeof obj === 'string' ? utf8(obj) : utf8(JSON.stringify(obj));
    const ct = new Uint8Array(await subtle.encrypt({ name: 'AES-GCM', iv }, key, pt));
    return b64u(concatBytes(iv, ct));
  }
  async function openRaw(key, str) {
    const raw = unb64u(str);
    if (raw.length < 29) throw new Error('ciphertext too short');
    const pt = await subtle.decrypt({ name: 'AES-GCM', iv: raw.subarray(0, 12) }, key, raw.subarray(12));
    return fromUtf8(new Uint8Array(pt));
  }
  async function open(key, str) {
    return JSON.parse(await openRaw(key, str));
  }

  /* ---------- Identity ---------- */
  const ECDSA = { name: 'ECDSA', namedCurve: 'P-256' };
  const ECDH = { name: 'ECDH', namedCurve: 'P-256' };

  async function idFromPk(pk) {
    return b64u(await sha256(unb64u(pk))).slice(0, 22);
  }

  async function createIdentity() {
    const sign = await subtle.generateKey(ECDSA, true, ['sign', 'verify']);
    const dh = await subtle.generateKey(ECDH, true, ['deriveBits']);
    return identityFromKeys(sign, dh);
  }
  async function identityFromKeys(sign, dh) {
    const pk = b64u(new Uint8Array(await subtle.exportKey('raw', sign.publicKey)));
    const dhpk = b64u(new Uint8Array(await subtle.exportKey('raw', dh.publicKey)));
    return { id: await idFromPk(pk), pk, dhpk, signKey: sign.privateKey, dhKey: dh.privateKey };
  }
  async function exportIdentity(ident) {
    return {
      id: ident.id,
      pk: ident.pk,
      dhpk: ident.dhpk,
      signJwk: await subtle.exportKey('jwk', ident.signKey),
      dhJwk: await subtle.exportKey('jwk', ident.dhKey),
    };
  }
  async function importIdentity(rec) {
    const signKey = await subtle.importKey('jwk', rec.signJwk, ECDSA, true, ['sign']);
    const dhKey = await subtle.importKey('jwk', rec.dhJwk, ECDH, true, ['deriveBits']);
    const id = await idFromPk(rec.pk);
    if (id !== rec.id) throw new Error('identity record is inconsistent');
    return { id, pk: rec.pk, dhpk: rec.dhpk, signKey, dhKey };
  }

  const pkCache = new Map();
  async function importPk(pk) {
    let k = pkCache.get(pk);
    if (!k) {
      k = await subtle.importKey('raw', unb64u(pk), ECDSA, false, ['verify']);
      if (pkCache.size > 2000) pkCache.clear();
      pkCache.set(pk, k);
    }
    return k;
  }

  /** Signs an event body. Adds a (author id), pk, id and s. */
  async function signEvent(ident, body) {
    const ev = Object.assign({}, body, { a: ident.id, pk: ident.pk });
    delete ev.id;
    delete ev.s;
    const c = canonical(ev);
    const sig = new Uint8Array(await subtle.sign({ name: 'ECDSA', hash: 'SHA-256' }, ident.signKey, utf8(c)));
    ev.id = b64u(await sha256(c)).slice(0, 22);
    ev.s = b64u(sig);
    return ev;
  }

  /** Verifies id, author id and signature. Returns true or false, never throws. */
  async function verifyEvent(ev) {
    try {
      if (!ev || typeof ev !== 'object' || typeof ev.s !== 'string' || typeof ev.pk !== 'string') return false;
      const body = Object.assign({}, ev);
      delete body.id;
      delete body.s;
      const c = canonical(body);
      if (b64u(await sha256(c)).slice(0, 22) !== ev.id) return false;
      if ((await idFromPk(ev.pk)) !== ev.a) return false;
      const key = await importPk(ev.pk);
      return await subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, key, unb64u(ev.s), utf8(c));
    } catch {
      return false;
    }
  }

  /** Direct-message secrets from ECDH between two identities. */
  async function deriveDm(ident, otherId, otherDhpk) {
    const pub = await subtle.importKey('raw', unb64u(otherDhpk), ECDH, false, []);
    const shared = new Uint8Array(await subtle.deriveBits({ name: 'ECDH', public: pub }, ident.dhKey, 256));
    const ids = [ident.id, otherId].sort().join('|');
    const hk = await subtle.importKey('raw', shared, 'HKDF', false, ['deriveBits', 'deriveKey']);
    const bits = new Uint8Array(
      await subtle.deriveBits({ name: 'HKDF', hash: 'SHA-256', salt: utf8(ids), info: utf8('dyad/v1/dm') }, hk, 512)
    );
    const topic = hex(bits.subarray(0, 32));
    const raw = bits.slice(32);
    return { topic, roomId: 'd' + topic.slice(0, 31), keyRaw: b64u(raw), key: await importAes(raw) };
  }

  /* ---------- Safety numbers ---------- */
  const SAFETY_EMOJI = [...'🐶🐱🦊🐻🐼🐨🐯🦁🐮🐷🐸🐵🐔🐧🐦🦆🦉🐴🦄🐝🦋🐌🐞🐢🐍🐙🦀🐠🐬🐳🦈🐊🌵🌲🌴🍀🍁🍄🌻🌹🌙⭐🔥🌈⛄💧🍎🍋🍉🍇🍓🍒🍑🍍🥕🌽🍕🍩🎈🎸🚀⚓🔑'];
  async function safetyCode(pk) {
    const h = await sha256('dyad/v1/safety|' + pk);
    const emoji = [0, 1, 2, 3].map((i) => SAFETY_EMOJI[h[i] % SAFETY_EMOJI.length]).join(' ');
    const groups = [];
    for (let i = 0; i < 3; i++) {
      const n = ((h[4 + i * 3] << 16) | (h[5 + i * 3] << 8) | h[6 + i * 3]) % 10000;
      groups.push(String(n).padStart(4, '0'));
    }
    return { emoji, digits: groups.join(' ') };
  }

  /* ---------- History lock and backups ---------- */
  async function createLock(passphrase) {
    const salt = randomBytes(16);
    const dataKeyRaw = randomBytes(32);
    const kek = await pbkdf2Key(passphrase, salt, LOCK_KDF_ITER);
    const wrapped = await seal(kek, b64u(dataKeyRaw));
    const dataKey = await subtle.importKey('raw', dataKeyRaw, 'AES-GCM', false, ['encrypt', 'decrypt']);
    dataKeyRaw.fill(0);
    return { lock: { v: 1, salt: b64u(salt), iter: LOCK_KDF_ITER, wrapped }, dataKey };
  }
  /** Returns the data key, or null if the passphrase is wrong. */
  async function unlock(lock, passphrase) {
    const kek = await pbkdf2Key(passphrase, unb64u(lock.salt), lock.iter || LOCK_KDF_ITER);
    let rawStr;
    try {
      rawStr = await openRaw(kek, lock.wrapped);
    } catch {
      return null;
    }
    const raw = unb64u(rawStr);
    const key = await subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);
    return { key, raw };
  }
  async function rewrapLock(raw, newPassphrase) {
    const salt = randomBytes(16);
    const kek = await pbkdf2Key(newPassphrase, salt, LOCK_KDF_ITER);
    return { v: 1, salt: b64u(salt), iter: LOCK_KDF_ITER, wrapped: await seal(kek, b64u(raw)) };
  }

  async function encryptBackup(passphrase, payload) {
    const salt = randomBytes(16);
    const key = await pbkdf2Key(passphrase, salt, LOCK_KDF_ITER);
    return { format: 'dyadbackup', v: 1, salt: b64u(salt), iter: LOCK_KDF_ITER, data: await seal(key, payload) };
  }
  async function decryptBackup(passphrase, file) {
    if (!file || file.format !== 'dyadbackup') throw new Error('This is not a Dyad backup file.');
    if (file.v > 1) throw new Error('This backup was made by a newer version of Dyad.');
    const key = await pbkdf2Key(passphrase, unb64u(file.salt), file.iter || LOCK_KDF_ITER);
    try {
      return await open(key, file.data);
    } catch {
      throw new Error('Wrong passphrase for this backup.');
    }
  }

  /* ---------- Compression for invite codes ---------- */
  async function streamBytes(stream) {
    const chunks = [];
    const reader = stream.getReader();
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      chunks.push(value);
    }
    return concatBytes(...chunks);
  }
  async function deflate(str) {
    const s = new Blob([utf8(str)]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    return streamBytes(s);
  }
  async function inflate(bytes) {
    const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return fromUtf8(await streamBytes(s));
  }

  D.crypto = {
    normalizeCode,
    deriveRoom,
    roomFromCache,
    importAes,
    seal,
    open,
    openRaw,
    createIdentity,
    exportIdentity,
    importIdentity,
    idFromPk,
    signEvent,
    verifyEvent,
    deriveDm,
    safetyCode,
    createLock,
    unlock,
    rewrapLock,
    encryptBackup,
    decryptBackup,
    deflate,
    inflate,
    ROOM_KDF_ITER,
  };
})();

/* ---- core/schnorr.js ---- */
/* Dyad core: minimal BIP-340 Schnorr signing over secp256k1 (needed only for Nostr relays). */
(() => {
  'use strict';
  const D = globalThis.Dyad;
  const P = 0xfffffffffffffffffffffffffffffffffffffffffffffffffffffffefffffc2fn;
  const N = 0xfffffffffffffffffffffffffffffffebaaedce6af48a03bbfd25e8cd0364141n;
  const GX = 0x79be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798n;
  const GY = 0x483ada7726a3c4655da4fbfc0e1108a8fd17b448a68554199c47d08ffb10d4b8n;

  const mod = (a, m = P) => {
    const r = a % m;
    return r >= 0n ? r : r + m;
  };
  function inv(a, m = P) {
    let [lo, hi] = [mod(a, m), m];
    let [x0, x1] = [1n, 0n];
    while (lo > 1n) {
      const q = hi / lo;
      [lo, hi] = [hi - q * lo, lo];
      [x0, x1] = [x1 - q * x0, x0];
    }
    return mod(x0, m);
  }

  // Jacobian points [X, Y, Z]; Z = 0 is infinity.
  function dbl([X, Y, Z]) {
    if (Z === 0n || Y === 0n) return [0n, 1n, 0n];
    const YY = mod(Y * Y);
    const S = mod(4n * X * YY);
    const M = mod(3n * X * X);
    const X3 = mod(M * M - 2n * S);
    const Y3 = mod(M * (S - X3) - 8n * YY * YY);
    const Z3 = mod(2n * Y * Z);
    return [X3, Y3, Z3];
  }
  function add(p1, p2) {
    if (p1[2] === 0n) return p2;
    if (p2[2] === 0n) return p1;
    const [X1, Y1, Z1] = p1;
    const [X2, Y2, Z2] = p2;
    const Z1Z1 = mod(Z1 * Z1);
    const Z2Z2 = mod(Z2 * Z2);
    const U1 = mod(X1 * Z2Z2);
    const U2 = mod(X2 * Z1Z1);
    const S1 = mod(Y1 * Z2 * Z2Z2);
    const S2 = mod(Y2 * Z1 * Z1Z1);
    if (U1 === U2) return S1 === S2 ? dbl(p1) : [0n, 1n, 0n];
    const H = mod(U2 - U1);
    const R = mod(S2 - S1);
    const HH = mod(H * H);
    const HHH = mod(H * HH);
    const V = mod(U1 * HH);
    const X3 = mod(R * R - HHH - 2n * V);
    const Y3 = mod(R * (V - X3) - S1 * HHH);
    const Z3 = mod(Z1 * Z2 * H);
    return [X3, Y3, Z3];
  }
  function mul(k) {
    let R = [0n, 1n, 0n];
    let Q = [GX, GY, 1n];
    while (k > 0n) {
      if (k & 1n) R = add(R, Q);
      Q = dbl(Q);
      k >>= 1n;
    }
    return R;
  }
  function affine([X, Y, Z]) {
    const zi = inv(Z);
    const zi2 = mod(zi * zi);
    return [mod(X * zi2), mod(Y * zi2 * zi)];
  }

  const toBytes = (n) => D.unhex(n.toString(16).padStart(64, '0'));
  const toBig = (b) => BigInt('0x' + (D.hex(b) || '0'));

  const tagCache = new Map();
  async function taggedHash(tag, ...msgs) {
    let th = tagCache.get(tag);
    if (!th) {
      th = await D.sha256(tag);
      tagCache.set(tag, th);
    }
    return D.sha256(D.concatBytes(th, th, ...msgs));
  }

  function getPublicKey(sk) {
    const d = toBig(sk);
    if (d <= 0n || d >= N) throw new Error('invalid secret key');
    return toBytes(affine(mul(d))[0]);
  }

  async function sign(msg, sk, aux = D.randomBytes(32)) {
    const d0 = toBig(sk);
    if (d0 <= 0n || d0 >= N) throw new Error('invalid secret key');
    const [px, py] = affine(mul(d0));
    const d = py % 2n === 0n ? d0 : N - d0;
    const pxb = toBytes(px);
    const t = toBytes(d ^ toBig(await taggedHash('BIP0340/aux', aux)));
    const k0 = mod(toBig(await taggedHash('BIP0340/nonce', t, pxb, msg)), N);
    if (k0 === 0n) throw new Error('bad nonce');
    const [rx, ry] = affine(mul(k0));
    const k = ry % 2n === 0n ? k0 : N - k0;
    const rxb = toBytes(rx);
    const e = mod(toBig(await taggedHash('BIP0340/challenge', rxb, pxb, msg)), N);
    return D.concatBytes(rxb, toBytes(mod(k + e * d, N)));
  }

  function randomSecretKey() {
    for (;;) {
      const sk = D.randomBytes(32);
      const v = toBig(sk);
      if (v > 0n && v < N) return sk;
    }
  }

  D.schnorr = { getPublicKey, sign, randomSecretKey };
})();

/* ---- core/words.js ---- */
/* Dyad core: friendly room code generator. */
(() => {
  'use strict';
  const D = globalThis.Dyad;
  // 256 short, distinct, easy-to-spell words.
  const WORDS = (
    'acorn amber anchor apple arrow aspen atlas aurora autumn badge bamboo banjo basil beacon berry birch ' +
    'bison blaze bloom blue bolt breeze brook bubble cabin cactus camel candle canyon cargo cedar cello ' +
    'chalk charm cherry chess cider cinder citrus clay clover cobalt comet coral cosmos cotton crane crater ' +
    'crest crystal cumin cypress dahlia daisy delta denim desert dew dingo dove dragon drift dune eagle ' +
    'echo eclipse ember emerald falcon fern fiesta fig finch fjord flame flint flora fog forest fossil ' +
    'fox frost galaxy garnet gecko geyser ginger glacier globe gold granite grape gravel harbor hazel ' +
    'heron hickory honey horizon husky iceberg igloo indigo iris island ivory jade jasmine jelly jungle ' +
    'juniper kayak kelp kettle kiwi koala lagoon lantern lark lava lemon lilac lily lime linen lotus ' +
    'lunar lynx magma mango maple marble marsh meadow melon mesa meteor mint mocha moon moss nectar ' +
    'nebula nickel noble nova oak oasis ocean olive onyx opal orbit orchid otter owl panda papaya ' +
    'parade pebble pepper petal pine pixel planet plum polar pollen poppy prism puffin pumpkin quartz ' +
    'quill quokka radar rain raven reef ridge river robin rocket ruby saffron sage salmon sapphire ' +
    'savanna scarlet sequoia shadow shell sierra silver sky slate snow solar sonic spark sparrow spice ' +
    'spruce star stone storm sugar summit sunny swan tango teal thistle thunder tide tiger timber topaz ' +
    'trail tulip tundra turtle twig umber valley velvet violet vista walnut wave willow wind winter wren ' +
    'yarrow yonder zebra zenith zephyr zinc canvas cobble dawn harvest meadowlark nimbus puddle'
  ).split(' ');

  function pick(n) {
    const out = [];
    const buf = D.randomBytes(n * 2);
    for (let i = 0; i < n; i++) out.push(WORDS[buf[i] % WORDS.length]);
    return out;
  }
  /** e.g. "maple-orbit-zinc-482" (about 34 bits of entropy). */
  function roomCode() {
    const b = D.randomBytes(2);
    const num = ((b[0] << 8) | b[1]) % 1000;
    return pick(3).join('-') + '-' + String(num).padStart(3, '0');
  }
  /** Rough strength of a user-typed code, used for a warning. */
  function codeStrength(code) {
    const c = D.crypto.normalizeCode(code);
    if (c.length < 8) return 'weak';
    const parts = c.split('-').filter(Boolean);
    const generated = parts.length >= 4 && /^\d{3}$/.test(parts[parts.length - 1]);
    if (generated) return 'strong';
    let classes = 0;
    if (/[a-z]/.test(c)) classes++;
    if (/\d/.test(c)) classes++;
    if (c.length >= 16 && classes === 2) return 'strong';
    return c.length >= 12 ? 'ok' : 'weak';
  }

  D.words = { WORDS, roomCode, codeStrength };
})();

/* ---- core/events.js ---- */
/* Dyad core: signed event kinds and strict validation. */
(() => {
  'use strict';
  const D = globalThis.Dyad;

  const MAX_TEXT = 4000;
  const STORED = new Set(['msg', 'edit', 'del', 'react', 'profile', 'meta', 'read', 'dmi']);
  const EPHEMERAL = new Set(['typing', 'away', 'sess']);
  const ID_RE = /^[A-Za-z0-9_-]{22}$/;

  const isStr = (v, min, max) => typeof v === 'string' && v.length >= min && v.length <= max;
  const isId = (v) => typeof v === 'string' && ID_RE.test(v);

  /** Returns null if valid, otherwise a short reason. Never throws. */
  function invalid(e) {
    if (!e || typeof e !== 'object' || Array.isArray(e)) return 'not an object';
    if (e.v !== 1) return 'version';
    if (!STORED.has(e.k) && !EPHEMERAL.has(e.k)) return 'kind';
    if (!isId(e.id) || !isId(e.a)) return 'ids';
    if (!isStr(e.pk, 80, 100) || !isStr(e.s, 40, 140)) return 'keys';
    if (!isStr(e.r, 8, 40)) return 'room';
    if (typeof e.ts !== 'number' || !Number.isFinite(e.ts) || e.ts < 1.6e12) return 'time';
    if (e.ts > Date.now() + 10 * 60 * 1000) return 'future';
    const allowed = { v: 1, k: 1, id: 1, r: 1, a: 1, pk: 1, ts: 1, s: 1 };
    const extra = (keys) => {
      for (const k of Object.keys(e)) if (!allowed[k] && !keys.includes(k)) return true;
      return false;
    };
    switch (e.k) {
      case 'msg':
        if (!isStr(e.text, 1, MAX_TEXT)) return 'text';
        if (e.rp !== undefined && !isId(e.rp)) return 'reply';
        if (e.m !== undefined && (!Array.isArray(e.m) || e.m.length > 20 || !e.m.every(isId))) return 'mentions';
        return extra(['text', 'rp', 'm']) ? 'fields' : null;
      case 'edit':
        if (!isId(e.t) || !isStr(e.text, 1, MAX_TEXT)) return 'edit';
        if (e.m !== undefined && (!Array.isArray(e.m) || e.m.length > 20 || !e.m.every(isId))) return 'mentions';
        return extra(['t', 'text', 'm']) ? 'fields' : null;
      case 'del':
        return !isId(e.t) || extra(['t']) ? 'del' : null;
      case 'react':
        if (!isId(e.t) || !isStr(e.e, 1, 16) || typeof e.on !== 'boolean') return 'react';
        return extra(['t', 'e', 'on']) ? 'fields' : null;
      case 'profile':
        if (!isStr(e.n, 1, 40) || !Number.isInteger(e.c) || e.c < 0 || e.c > 11) return 'profile';
        if (!isStr(e.em, 0, 16) || !isStr(e.dh, 80, 100)) return 'profile';
        return extra(['n', 'c', 'em', 'dh']) ? 'fields' : null;
      case 'meta':
        return !isStr(e.n, 1, 60) || extra(['n']) ? 'meta' : null;
      case 'read':
        return typeof e.up !== 'number' || !Number.isFinite(e.up) || extra(['up']) ? 'read' : null;
      case 'dmi':
        return !isId(e.to) || extra(['to']) ? 'dmi' : null;
      case 'typing':
        return extra([]) ? 'fields' : null;
      case 'away':
        return typeof e.on !== 'boolean' || extra(['on']) ? 'away' : null;
      case 'sess':
        return !isStr(e.sid, 20, 20) || extra(['sid']) ? 'sess' : null;
    }
    return 'kind';
  }

  /** Validates shape, then signature. */
  async function accept(e) {
    if (invalid(e)) return false;
    return D.crypto.verifyEvent(e);
  }

  function build(ident, roomId, kind, fields) {
    return D.crypto.signEvent(ident, Object.assign({ v: 1, k: kind, r: roomId, ts: Date.now() }, fields));
  }

  /** Extracts @mentions given a name->id lookup. */
  function findMentions(text, members) {
    const out = new Set();
    const re = /(^|\s)@([\p{L}\p{N}_.-]{1,40})/gu;
    let m;
    while ((m = re.exec(text))) {
      const name = m[2].toLowerCase();
      for (const mem of members) {
        const n = (mem.name || '').toLowerCase().replace(/\s+/g, '');
        if (n && n === name.replace(/\s+/g, '')) out.add(mem.id);
      }
    }
    return [...out].slice(0, 20);
  }

  const INVISIBLE = /[\s\u00ad\u034f\u061c\u115f\u1160\u17b4\u17b5\u180e\u200b-\u200f\u202a-\u202e\u2060-\u206f\u3164\ufe00-\ufe0f\ufeff\uffa0]/gu;
  /** True if the text has at least one visible character. */
  const hasVisibleText = (t) => String(t || '').replace(INVISIBLE, '').length > 0;
  /** Removes bidi overrides and other invisible control characters from display names. */
  const cleanName = (n) => String(n || '').replace(/[\u200b-\u200f\u202a-\u202e\u2066-\u2069\u2060\ufeff\u061c]/g, '').replace(/\s+/g, ' ').trim();

  D.events = { hasVisibleText, cleanName, MAX_TEXT, STORED, EPHEMERAL, invalid, accept, build, findMentions, isId };
})();

/* ---- core/store.js ---- */
/* Dyad core: IndexedDB persistence with optional at-rest encryption. */
(() => {
  'use strict';
  const D = globalThis.Dyad;
  const { log } = D;

  const DB_NAME = 'dyad.chat';
  const DB_VERSION = 1;
  const SCHEMA = 1;
  const STORES = ['meta', 'rooms', 'events', 'members'];

  function req(r) {
    return new Promise((resolve, reject) => {
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
  }
  function txDone(tx) {
    return new Promise((resolve, reject) => {
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error || new Error('transaction aborted'));
    });
  }

  class Store {
    constructor(name = DB_NAME) {
      this.name = name;
      this.db = null;
      this.dataKey = null; // set when the history lock is active and unlocked
      this.queue = new Map(); // "store|key" -> {store, value|null}
      this.flushTimer = null;
      this.flushing = null;
    }
    async open() {
      if (!globalThis.indexedDB) throw new Error('This browser blocks local storage (IndexedDB).');
      const r = indexedDB.open(this.name, DB_VERSION);
      r.onupgradeneeded = () => {
        const db = r.result;
        if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'k' });
        if (!db.objectStoreNames.contains('rooms')) db.createObjectStore('rooms', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('events')) {
          const s = db.createObjectStore('events', { keyPath: 'id' });
          s.createIndex('room', 'room');
        }
        if (!db.objectStoreNames.contains('members')) db.createObjectStore('members', { keyPath: 'key' });
      };
      r.onblocked = () => log.warn('database upgrade blocked by another tab');
      this.db = await req(r);
      this.db.onversionchange = () => {
        this.db.close();
        D.emitGlobal && D.emitGlobal('dbclosed');
      };
      const schema = await this.getMeta('schemaVersion', true);
      if (schema == null) await this.putMetaNow('schemaVersion', SCHEMA);
      else if (schema > SCHEMA) this.readOnly = true;
      else if (schema < SCHEMA) await this.migrate(schema);
      return this;
    }
    async migrate(from) {
      // Future migrations go here, one step at a time (1 -> 2, 2 -> 3 ...).
      log.info('schema migrate from', from);
      await this.putMetaNow('schemaVersion', SCHEMA);
    }

    /* ---- encryption wrappers ---- */
    async wrap(obj) {
      if (!this.dataKey) return obj;
      const out = {};
      for (const k of ['k', 'id', 'key', 'room', 'ts']) if (obj[k] !== undefined) out[k] = obj[k];
      out.enc = await D.crypto.seal(this.dataKey, obj);
      return out;
    }
    async unwrap(rec) {
      if (!rec || rec.enc === undefined) return rec;
      if (!this.dataKey) throw new Error('locked');
      return D.crypto.open(this.dataKey, rec.enc);
    }

    /* ---- meta ---- */
    async getMeta(k, raw) {
      const rec = await req(this.db.transaction('meta').objectStore('meta').get(k));
      if (!rec) return undefined;
      if (raw) return rec.v;
      const v = await this.unwrap(rec);
      return v ? v.v : undefined;
    }
    /** Writes a meta value immediately. Plain values (lock, schema) are never encrypted. */
    async putMetaNow(k, v, plain = true) {
      const tx = this.db.transaction('meta', 'readwrite');
      const rec = plain ? { k, v } : await this.wrap({ k, v });
      tx.objectStore('meta').put(rec);
      await txDone(tx);
    }
    async putMeta(k, v) {
      return this.putMetaNow(k, v, false);
    }

    /* ---- bulk loading ---- */
    async all(store) {
      const recs = await req(this.db.transaction(store).objectStore(store).getAll());
      const out = [];
      for (const r of recs) {
        try {
          out.push(await this.unwrap(r));
        } catch (e) {
          log.warn('unreadable record in', store, e.message);
        }
      }
      return out;
    }

    /* ---- write queue (batched, one transaction per flush) ---- */
    put(store, value) {
      const key = value.k ?? value.id ?? value.key;
      this.queue.set(store + '|' + key, { store, key, value });
      this.scheduleFlush();
    }
    del(store, key) {
      this.queue.set(store + '|' + key, { store, key, value: null });
      this.scheduleFlush();
    }
    scheduleFlush() {
      if (this.flushTimer) return;
      this.flushTimer = setTimeout(() => this.flush(), 40);
    }
    async flush() {
      clearTimeout(this.flushTimer);
      this.flushTimer = null;
      if (this.flushing) await this.flushing;
      if (!this.queue.size || this.readOnly) return;
      const items = [...this.queue.values()];
      this.queue.clear();
      this.flushing = (async () => {
        const prepared = [];
        for (const it of items) prepared.push({ ...it, rec: it.value ? await this.wrap(it.value) : null });
        const tx = this.db.transaction(STORES, 'readwrite');
        for (const it of prepared) {
          const os = tx.objectStore(it.store);
          if (it.rec) os.put(it.rec);
          else os.delete(it.key);
        }
        await txDone(tx);
      })();
      try {
        await this.flushing;
      } catch (e) {
        log.error('save failed', e);
        D.emitGlobal && D.emitGlobal('saveError', e);
      } finally {
        this.flushing = null;
      }
    }

    /** Re-writes every record with the current dataKey (used when the lock is turned on/off). */
    async rewriteAll(newKey) {
      await this.flush();
      const data = {};
      for (const s of STORES) data[s] = await this.all(s);
      this.dataKey = newKey;
      const tx = this.db.transaction(STORES, 'readwrite');
      const prepared = {};
      for (const s of STORES) {
        prepared[s] = [];
        for (const rec of data[s]) {
          if (s === 'meta' && (rec.k === 'lock' || rec.k === 'schemaVersion')) continue;
          prepared[s].push(await this.wrap(rec));
        }
      }
      for (const s of STORES) {
        const os = tx.objectStore(s);
        for (const rec of prepared[s]) os.put(rec);
      }
      await txDone(tx);
    }

    async wipe() {
      this.queue.clear();
      const tx = this.db.transaction(STORES, 'readwrite');
      for (const s of STORES) tx.objectStore(s).clear();
      await txDone(tx);
      await this.putMetaNow('schemaVersion', SCHEMA);
    }

    /** Raw dump for tests and diagnostics (no decryption). */
    async rawDump() {
      const out = {};
      for (const s of STORES) out[s] = await req(this.db.transaction(s).objectStore(s).getAll());
      return out;
    }
  }

  D.Store = Store;
  D.SCHEMA = SCHEMA;
})();

/* ---- core/markdown.js ---- */
/* Dyad core: tiny safe markdown parser producing a node tree (rendered with text nodes only). */
(() => {
  'use strict';
  const D = globalThis.Dyad;

  const INLINE = [
    { t: 'code', re: /`([^`\n]+)`/ },
    { t: 'link', re: /\bhttps?:\/\/[^\s<>"'`]+[^\s<>"'`.,;:!?)\]]/i },
    { t: 'b', re: /\*\*(?=\S)([\s\S]+?)\*\*/ },
    { t: 's', re: /~~(?=\S)([\s\S]+?)~~/ },
    { t: 'i', re: /(^|[^\w*])\*(?=[^\s*])([^*\n]+?)\*(?![\w*])/ },
    { t: 'i', re: /(^|[^\w])_(?=[^\s_])([^_\n]+?)_(?![\w])/ },
    { t: 'mention', re: /(^|[^\w@])@([\p{L}\p{N}_.-]{1,40})/u },
  ];

  function parseInline(str, depth = 0) {
    const out = [];
    let rest = str;
    while (rest) {
      let best = null;
      for (const p of INLINE) {
        if (depth > 3 && (p.t === 'b' || p.t === 's' || p.t === 'i')) continue;
        const m = p.re.exec(rest);
        if (m && (!best || m.index < best.m.index)) best = { p, m };
      }
      if (!best) {
        out.push({ t: 'text', v: rest });
        break;
      }
      const { p, m } = best;
      let start = m.index;
      let lead = '';
      if (p.t === 'i' || p.t === 'mention') {
        lead = m[1];
        start += lead.length;
      }
      const before = rest.slice(0, m.index) + lead;
      if (before) out.push({ t: 'text', v: before });
      if (p.t === 'code') out.push({ t: 'code', v: m[1] });
      else if (p.t === 'link') out.push({ t: 'link', href: m[0], v: m[0] });
      else if (p.t === 'mention') out.push({ t: 'mention', v: m[2] });
      else out.push({ t: p.t, c: parseInline(p.t === 'i' ? m[2] : m[1], depth + 1) });
      rest = rest.slice(m.index + m[0].length);
      void start;
    }
    return out;
  }

  function parseLines(text) {
    const out = [];
    const lines = text.split('\n');
    let i = 0;
    while (i < lines.length) {
      if (/^>\s?/.test(lines[i])) {
        const q = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) q.push(lines[i++].replace(/^>\s?/, ''));
        out.push({ t: 'quote', c: parseLines(q.join('\n')) });
        continue;
      }
      if (out.length && out[out.length - 1].t !== 'quote') out.push({ t: 'br' });
      out.push(...parseInline(lines[i]));
      i++;
    }
    return out;
  }

  /** Full parse: code fences, quotes, inline. */
  function parse(text) {
    const out = [];
    const re = /```([a-zA-Z0-9_+-]{0,20})\n?([\s\S]*?)```/g;
    let last = 0;
    let m;
    while ((m = re.exec(text))) {
      const before = text.slice(last, m.index).replace(/\n$/, '');
      if (before) out.push(...parseLines(before));
      out.push({ t: 'pre', v: m[2].replace(/\n$/, ''), lang: m[1] || '' });
      last = m.index + m[0].length;
      if (text[last] === '\n') last++;
    }
    const tail = text.slice(last);
    if (tail) out.push(...parseLines(tail));
    return out;
  }

  const EMOJI_ONLY = /^(?:\p{Extended_Pictographic}|\p{Emoji_Modifier}|\p{Regional_Indicator}|‍|️|⃣|[#*0-9]️?⃣|\s)+$/u;
  function emojiOnly(text) {
    const t = text.trim();
    if (!t || t.length > 40 || !EMOJI_ONLY.test(t) || /^[\d#*\s]+$/.test(t)) return false;
    const count = (t.match(/\p{Extended_Pictographic}|\p{Regional_Indicator}{2}/gu) || []).length;
    return count > 0 && count <= 6;
  }

  /** Plain-text preview (for notifications, reply quotes, sidebar). */
  function plain(text, max = 120) {
    const s = text
      .replace(/```[\s\S]*?```/g, '[code]')
      .replace(/[*_~`>]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
    return s.length > max ? s.slice(0, max - 1) + '…' : s;
  }

  D.markdown = { parse, parseInline, emojiOnly, plain };
})();

/* ---- core/qr.js ---- */
/* Dyad core: QR code encoder (byte mode), after the public QR Code specification. */
(() => {
  'use strict';
  const D = globalThis.Dyad;

  const ECC = {
    L: { bits: 1, per: [-1, 7, 10, 15, 20, 26, 18, 20, 24, 30, 18, 20, 24, 26, 30, 22, 24, 28, 30, 28, 28, 28, 28, 30, 30, 26, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
      blocks: [-1, 1, 1, 1, 1, 1, 2, 2, 2, 2, 4, 4, 4, 4, 4, 6, 6, 6, 6, 7, 8, 8, 9, 9, 10, 12, 12, 12, 13, 14, 15, 16, 17, 18, 19, 19, 20, 21, 22, 24, 25] },
    M: { bits: 0, per: [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28],
      blocks: [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49] },
  };

  function rawModules(ver) {
    let r = (16 * ver + 128) * ver + 64;
    if (ver >= 2) {
      const n = Math.floor(ver / 7) + 2;
      r -= (25 * n - 10) * n - 55;
      if (ver >= 7) r -= 36;
    }
    return r;
  }
  const dataCodewords = (ver, e) => Math.floor(rawModules(ver) / 8) - e.per[ver] * e.blocks[ver];

  function gfMul(x, y) {
    let z = 0;
    for (let i = 7; i >= 0; i--) {
      z = (z << 1) ^ ((z >>> 7) * 0x11d);
      z ^= ((y >>> i) & 1) * x;
    }
    return z & 255;
  }
  function rsDivisor(degree) {
    const r = new Array(degree).fill(0);
    r[degree - 1] = 1;
    let root = 1;
    for (let i = 0; i < degree; i++) {
      for (let j = 0; j < r.length; j++) {
        r[j] = gfMul(r[j], root);
        if (j + 1 < r.length) r[j] ^= r[j + 1];
      }
      root = gfMul(root, 2);
    }
    return r;
  }
  function rsRemainder(data, div) {
    const r = div.map(() => 0);
    for (const b of data) {
      const f = b ^ r.shift();
      r.push(0);
      div.forEach((c, i) => (r[i] ^= gfMul(c, f)));
    }
    return r;
  }

  function encode(bytes, level = 'L') {
    if (typeof bytes === 'string') bytes = D.utf8(bytes);
    const e = ECC[level];
    let ver = 1;
    for (; ver <= 40; ver++) {
      const ccBits = ver < 10 ? 8 : 16;
      if (4 + ccBits + bytes.length * 8 <= dataCodewords(ver, e) * 8) break;
    }
    if (ver > 40) throw new Error('Data too long for a QR code');
    const ccBits = ver < 10 ? 8 : 16;
    const bits = [];
    const push = (val, n) => {
      for (let i = n - 1; i >= 0; i--) bits.push((val >>> i) & 1);
    };
    push(4, 4);
    push(bytes.length, ccBits);
    for (const b of bytes) push(b, 8);
    const cap = dataCodewords(ver, e) * 8;
    push(0, Math.min(4, cap - bits.length));
    push(0, (8 - (bits.length % 8)) % 8);
    for (let pad = 0xec; bits.length < cap; pad ^= 0xec ^ 0x11) push(pad, 8);
    const data = [];
    for (let i = 0; i < bits.length; i += 8) {
      let v = 0;
      for (let j = 0; j < 8; j++) v = (v << 1) | bits[i + j];
      data.push(v);
    }

    // Error correction and interleaving.
    const nb = e.blocks[ver];
    const eccLen = e.per[ver];
    const raw = Math.floor(rawModules(ver) / 8);
    const nShort = nb - (raw % nb);
    const shortLen = Math.floor(raw / nb);
    const div = rsDivisor(eccLen);
    const blocks = [];
    for (let i = 0, k = 0; i < nb; i++) {
      const dat = data.slice(k, k + shortLen - eccLen + (i < nShort ? 0 : 1));
      k += dat.length;
      const ecc = rsRemainder(dat, div);
      if (i < nShort) dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    const codewords = [];
    for (let i = 0; i < blocks[0].length; i++) {
      blocks.forEach((b, j) => {

    }

    const setFn = (x, y, dark) => {
      mods[y][x] = dark;
      isFn[y][x] = true;
